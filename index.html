    /* ------------------------------------------------------------------------
       SCREEN D: MODE 1 — MEMORIES (3D Flashcards + 5-Word Mini-Quiz Cycle)
       ------------------------------------------------------------------------ */
    function startMemoriesMode(unitId, resumeFromBookmark = false) {
      const unit = AppState.unitsById[unitId];
      if (!unit || !unit.words.length) {
        showToast('Add words to this unit first!');
        return;
      }

      const deck = LearningEngine.buildMemoriesDeck(unit);
      let startIndex = 0;
      let fiveCounter = 0;
      let batchIds = [];

      const bm = AppState.progress.bookmark;
      if (resumeFromBookmark && bm && bm.unitId === unitId) {
        startIndex = Math.min(Math.max(0, Number(bm.cardIndex) || 0), deck.length - 1);
        fiveCounter = Math.min(4, Math.max(0, Number(bm.fiveWordCounter) || 0));
        if (Array.isArray(bm.batchWordIds)) {
          batchIds = bm.batchWordIds.filter((id) => unit.words.some((w) => w.id === id));
        }
      }

      const firstWord = deck[startIndex];
      if (firstWord && !batchIds.includes(firstWord.id)) {
        batchIds.push(firstWord.id);
        fiveCounter = Math.max(fiveCounter, batchIds.length);
      }

      AppState.memoriesSession = {
        unitId,
        deck,
        cardIndex: startIndex,
        flipped: false,
        fiveWordCounter: fiveCounter,
        batchWordIds: batchIds
      };

      persistMemoriesBookmark();
      navigate('memories', { unitId });
    }

    function persistMemoriesBookmark() {
      const s = AppState.memoriesSession;
      if (!s) return;
      AppState.progress.bookmark = {
        unitId: s.unitId,
        mode: 'memories',
        cardIndex: s.cardIndex,
        fiveWordCounter: s.fiveWordCounter,
        batchWordIds: s.batchWordIds.slice(0, 5),
        ts: Date.now()
      };
      DataStore.saveProgress({ flushImmediate: false });
    }

    function launchMemoriesMiniQuiz(batchWordIds, isEndOfDeck) {
      const s = AppState.memoriesSession;
      const unit = s ? AppState.unitsById[s.unitId] : null;
      if (!s || !unit) return;

      const batchWords = LearningEngine.shuffle(
        batchWordIds
          .map((id) => unit.words.find((w) => w.id === id))
          .filter(Boolean)
      );

      if (!batchWords.length) {
        finishMemoriesDeckCelebration(unit);
        return;
      }

      AppState.miniQuizSession = {
        unitId: unit.id,
        questions: batchWords.map((w) => ({
          wordObj: w,
          gapIndices: LearningEngine.pickGapIndices(w.word, 2),
          posChoices: LearningEngine.buildPosChoices(w.partOfSpeech)
        })),
        qIndex: 0,
        correctCount: 0,
        isEndOfDeck: Boolean(isEndOfDeck),
        startedAt: performance.now()
      };

      navigate('miniQuiz', { unitId: unit.id });
    }

    function finishMemoriesDeckCelebration(unit) {
      AppState.progress.bookmark = null;
      DataStore.saveProgress({ flushImmediate: true });
      SoundEngine.playMastery();
      triggerConfetti(42);
      showToast(`Completed Memories deck for "${unit.name}"!`);
      navigate('unitHome', { unitId: unit.id });
    }

    function renderMemoriesScreen(container) {
      const s = AppState.memoriesSession;
      const unit = s ? AppState.unitsById[s.unitId] : null;
      if (!s || !unit || !s.deck.length) {
        navigate('unitHome');
        return;
      }

      const wordObj = s.deck[s.cardIndex];
      const nextWordObj = s.deck[s.cardIndex + 1] || null;
      if (nextWordObj) {
        preloadWordImage(nextWordObj);
        TTSManager.prefetch(nextWordObj.word);
      }

      const rec = LearningEngine.getWordRecord(unit.id, wordObj.id);
      const statusChipText =
        rec.status === 'mastered'
          ? 'Mastered'
          : rec.status === 'recovering'
            ? `Recovery ${rec.mistakeStreakRecovery}/3`
            : rec.status === 'learning'
              ? 'Learning'
              : 'New Word';

      container.appendChild(el('div', { className: 'screen-header' },
        el('button', {
          type: 'button',
          className: 'btn3d btn-sm',
          onClick: () => navigate('unitHome', { unitId: unit.id })
        }, '← Unit Home'),
        el('div', { className: 'row-wrap' },
          el('span', { className: 'pill-stat' }, `Card ${s.cardIndex + 1} / ${s.deck.length}`),
          el('span', { className: 'pill-stat', style: { background: 'var(--honey-soft)', borderColor: 'var(--honey-gold-lip)' } },
            `Mini-Quiz in ${Math.max(1, 5 - s.batchWordIds.length + 1)} card(s)`
          )
        )
      ));

      const stage = el('div', { className: 'memories-layout' });

      // Deck progress bar
      const deckPct = Math.round(((s.cardIndex + 1) / s.deck.length) * 100);
      stage.appendChild(el('div', { className: 'progress-track' },
        el('div', { className: 'progress-fill gold', style: { width: deckPct + '%' } })
      ));

      const innerCard = el('div', {
        id: 'memories-card-inner',
        className: 'flashcard-inner' + (s.flipped ? ' is-flipped' : '')
      });

      const frontFace = el('div', { className: 'flashcard-face flashcard-front' });
      const backFace = el('div', { className: 'flashcard-face flashcard-back' });

      const syncFaceInert = () => {
        frontFace.inert = Boolean(s.flipped);
        backFace.inert = !s.flipped;
        innerCard.classList.toggle('is-flipped', Boolean(s.flipped));
      };

      const toggleFlip = () => {
        s.flipped = !s.flipped;
        SoundEngine.playFlip();
        syncFaceInert();
        persistMemoriesBookmark();
      };

      // Front Face Content
      const initialThai = wordObj.meaningThai || ThaiTranslator.getCached(wordObj.word);
      const thaiFrontSpan = el('span', { className: 'thai-text-content' }, initialThai || 'กำลังแปลคำศัพท์...');
      const thaiFront = el('div', { className: 'thai-translation-front' },
        el('span', { className: 'thai-flag-badge' }, 'TH'),
        thaiFrontSpan
      );

      const thaiBackSpan = el('span', { className: 'thai-back-content' }, initialThai || 'กำลังแปลคำศัพท์...');
      const thaiBackBox = el('div', { className: 'thai-translation-back' },
        el('span', { className: 'thai-flag-badge' }, 'แปลไทย'),
        thaiBackSpan
      );

      if (!initialThai) {
        ThaiTranslator.translate(wordObj.word, wordObj.meaning).then((res) => {
          if (res) {
            wordObj.meaningThai = res;
            thaiFrontSpan.textContent = res;
            thaiBackSpan.textContent = res;
          }
        });
      }

      frontFace.append(
        el('div', { className: 'row-between', style: { width: '100%' } },
          el('span', { className: 'pos-badge' }, wordObj.partOfSpeech),
          el('span', { className: 'pill-stat', style: { fontSize: '0.8rem' } }, statusChipText)
        ),
        el('div', { className: 'word-img-frame' },
          createResilientWordImage(wordObj, { hideWordText: false })
        ),
        el('div', { className: 'word-display-lg' }, wordObj.word),
        thaiFront,
        el('div', { className: 'row-wrap', style: { justifyContent: 'center' } },
          el('button', {
            type: 'button',
            className: 'btn3d btn-blue btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: false })
          }, createIcon3D('speaker', 18), el('span', {}, 'Pronounce')),
          el('button', {
            type: 'button',
            className: 'btn3d btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: true })
          }, createIcon3D('turtle', 18), el('span', {}, 'Slow')),
          el('button', {
            type: 'button',
            id: 'memories-flip-front-btn',
            className: 'btn3d btn-gold',
            onClick: toggleFlip
          }, 'Tap to See Meaning')
        )
      );

      // Back Face Content
      backFace.append(
        el('div', { className: 'row-between', style: { width: '100%' } },
          el('span', { className: 'pos-badge' }, wordObj.partOfSpeech),
          el('strong', { style: { fontSize: '1.15rem' } }, wordObj.word)
        ),
        el('div', { className: 'stack-sm', style: { width: '100%' } },
          el('span', { className: 'subtitle-muted', style: { fontSize: '0.82rem', textTransform: 'uppercase' } }, 'Thai Translation'),
          thaiBackBox
        ),
        el('div', { className: 'stack-sm', style: { width: '100%' } },
          el('span', { className: 'subtitle-muted', style: { fontSize: '0.82rem', textTransform: 'uppercase' } }, 'English Meaning'),
          el('div', { className: 'meaning-box' }, wordObj.meaning)
        ),
        el('div', { className: 'stack-sm', style: { width: '100%' } },
          el('span', { className: 'subtitle-muted', style: { fontSize: '0.82rem', textTransform: 'uppercase' } }, 'Example Sentence'),
          el('div', { className: 'example-box' }, `"${wordObj.exampleSentence}"`)
        ),
        el('div', { className: 'row-wrap', style: { justifyContent: 'center' } },
          el('button', {
            type: 'button',
            className: 'btn3d btn-blue btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: false })
          }, 'Word'),
          el('button', {
            type: 'button',
            className: 'btn3d btn-sm',
            onClick: () => TTSManager.speak(wordObj.exampleSentence, { slow: false })
          }, 'Sentence'),
          el('button', {
            type: 'button',
            className: 'btn3d btn-amber',
            onClick: toggleFlip
          }, 'Flip Back to Word')
        )
      );

      syncFaceInert();
      innerCard.append(frontFace, backFace);
      stage.appendChild(el('div', { className: 'flashcard-scene' }, innerCard));

      const goPrev = () => {
        if (s.cardIndex <= 0) return;
        s.cardIndex--;
        s.flipped = false;
        persistMemoriesBookmark();
        renderCurrentScreen();
        updateHudUI();
      };

      const goNext = () => {
        const isLastCard = s.cardIndex >= s.deck.length - 1;

        // Trigger automatic 5-word mini-quiz once 5 unique batch cards have been studied!
        if (s.batchWordIds.length >= 5) {
          const toQuiz = [...s.batchWordIds];
          s.batchWordIds = [];
          s.fiveWordCounter = 0;
          if (!isLastCard) {
            s.cardIndex++;
            s.flipped = false;
          }
          persistMemoriesBookmark();
          launchMemoriesMiniQuiz(toQuiz, isLastCard);
          return;
        }

        if (isLastCard) {
          if (s.batchWordIds.length > 0) {
            const leftover = [...s.batchWordIds];
            s.batchWordIds = [];
            s.fiveWordCounter = 0;
            persistMemoriesBookmark();
            launchMemoriesMiniQuiz(leftover, true);
          } else {
            finishMemoriesDeckCelebration(unit);
          }
          return;
        }

        s.cardIndex++;
        s.flipped = false;
        const upcoming = s.deck[s.cardIndex];
        if (upcoming && !s.batchWordIds.includes(upcoming.id)) {
          s.batchWordIds.push(upcoming.id);
        }
        s.fiveWordCounter = s.batchWordIds.length;
        persistMemoriesBookmark();
        renderCurrentScreen();
        updateHudUI();
      };

      const isLast = s.cardIndex >= s.deck.length - 1;
      const nextBtnLabel = s.batchWordIds.length >= 5
        ? '5-Word Mini-Quiz →'
        : (isLast ? 'Final Check →' : 'Next Card →');

      stage.appendChild(el('div', { className: 'memories-nav-bar' },
        el('button', {
          type: 'button',
          className: 'btn3d',
          disabled: s.cardIndex === 0,
          onClick: goPrev
        }, '← Previous'),
        el('span', { className: 'subtitle-muted', style: { fontSize: '0.82rem', textAlign: 'center' } }, 'Space: Flip · ←/→: Navigate'),
        el('button', {
          type: 'button',
          className: 'btn3d btn-green',
          onClick: goNext
        }, nextBtnLabel)
      ));

      container.appendChild(stage);

      // Keyboard navigation for Memories
      const onKey = (ev) => {
        if (document.querySelector('dialog[open]')) return;
        const tag = ev.target && ev.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (ev.code === 'Space' || ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          toggleFlip();
        } else if (ev.key === 'ArrowRight' || ev.key === 'Enter') {
          ev.preventDefault();
          goNext();
        } else if (ev.key === 'ArrowLeft') {
          ev.preventDefault();
          goPrev();
        } else if (ev.key === 'r' || ev.key === 'R' || ev.key === 'a' || ev.key === 'A') {
          ev.preventDefault();
          TTSManager.speak(wordObj.word, { slow: false });
        }
      };
      window.addEventListener('keydown', onKey);
      registerScreenCleanup(() => window.removeEventListener('keydown', onKey));
    }

    /* ------------------------------------------------------------------------
       SCREEN E: MEMORIES AUTOMATIC 5-WORD 2-LETTER-GAP MINI-QUIZ (Section 5.1)
       ------------------------------------------------------------------------ */
    function buildGapInputsWidget(wordStr, gapIndices, onInputChanged, onSubmitEnter) {
      const chars = Array.from(wordStr);
      const gapSet = new Set(gapIndices);
      const wrap = el('div', { className: 'gaps-word-wrap' });
      const inputs = [];

      chars.forEach((ch, idx) => {
        if (!gapSet.has(idx)) {
          wrap.appendChild(el('span', { className: 'gap-static-tile' }, ch));
          return;
        }
        const posInInputs = inputs.length;
        const inp = el('input', {
          type: 'text',
          className: 'gap-char-input',
          maxlength: '1',
          autocomplete: 'off',
          autocorrect: 'off',
          autocapitalize: 'none',
          spellcheck: 'false',
          enterkeyhint: posInInputs === gapIndices.length - 1 ? 'done' : 'next',
          'aria-label': `Missing letter ${posInInputs + 1}`
        });

        inp.addEventListener('input', () => {
          const val = Array.from(inp.value.trim());
          inp.value = val.length ? val[val.length - 1] : '';
          onInputChanged();
          if (inp.value && inputs[posInInputs + 1]) {
            inputs[posInInputs + 1].focus();
            inputs[posInInputs + 1].select();
          }
        });

        inp.addEventListener('keydown', (ev) => {
          if (ev.key === 'Backspace' && !inp.value && inputs[posInInputs - 1]) {
            ev.preventDefault();
            inputs[posInInputs - 1].focus();
            inputs[posInInputs - 1].value = '';
            onInputChanged();
          } else if (ev.key === 'ArrowLeft' && inputs[posInInputs - 1]) {
            ev.preventDefault();
            inputs[posInInputs - 1].focus();
          } else if (ev.key === 'ArrowRight' && inputs[posInInputs + 1]) {
            ev.preventDefault();
            inputs[posInInputs + 1].focus();
          } else if (ev.key === 'Enter' && !isImeComposing(ev)) {
            ev.preventDefault();
            onSubmitEnter();
          }
        });

        inp.addEventListener('paste', (ev) => {
          const text = (ev.clipboardData && ev.clipboardData.getData('text')) || '';
          const clean = Array.from(text.replace(/\s+/g, ''));
          if (!clean.length) return;
          ev.preventDefault();
          for (let k = 0; k < clean.length && (posInInputs + k) < inputs.length; k++) {
            inputs[posInInputs + k].value = clean[k];
          }
          onInputChanged();
          const focusIdx = Math.min(inputs.length - 1, posInInputs + clean.length);
          inputs[focusIdx].focus();
        });

        inputs.push({ input: inp, charIndex: idx, expected: ch });
        wrap.appendChild(inp);
      });

      const reconstructWord = () => {
        const out = [...chars];
        inputs.forEach(({ input, charIndex }) => {
          out[charIndex] = input.value.trim() || '_';
        });
        return out.join('');
      };

      const isAllFilled = () => inputs.every(({ input }) => input.value.trim().length === 1);

      return { wrap, inputs, reconstructWord, isAllFilled };
    }

    function renderMiniQuizScreen(container) {

        navigate('memories');
        return;
      }

      const item = mq.questions[mq.qIndex];
      const wordObj = item.wordObj;
      let selectedPos = '';
      let evaluated = false;
      const qStart = performance.now();

      if (mq.questions[mq.qIndex + 1]) {
        TTSManager.prefetch(mq.questions[mq.qIndex + 1].wordObj.word);
      }

      container.appendChild(el('div', { className: 'screen-header' },

        ),
        el('button', {
          type: 'button',
          className: 'btn3d btn-sm',
          onClick: () => navigate('memories', { unitId: unit.id })
        }, 'Skip Back to Deck')
      ));

      const stage = el('div', { className: 'quiz-stage split-capable' });

      const mqThaiHint = wordObj.meaningThai || ThaiTranslator.getCached(wordObj.word);
      const promptCard = el('div', { className: 'card3d quiz-prompt-card', style: { alignItems: 'center', textAlign: 'center' } },

        ),

          mqThaiHint

                style: {
                  fontSize: '0.98rem',
                  fontWeight: '700',
                  color: 'var(--honey-dark)',
                  marginBottom: '0.35rem',
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '0.35rem'
                }
              },
                el('span', { className: 'thai-flag-badge' }, 'TH'),
                el('span', {}, mqThaiHint)
              )
            : null,
          el('div', {}, wordObj.meaning)
        ),
        el('div', { className: 'row-wrap', style: { justifyContent: 'center' } },
          el('button', {
            type: 'button',
            className: 'btn3d btn-blue btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: false })
          }, createIcon3D('speaker', 18), el('span', {}, 'Audio Hint')),
          el('button', {
            type: 'button',
            className: 'btn3d btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: true })
          }, createIcon3D('turtle', 18), el('span', {}, 'Slow'))
        )
      );

      let checkBtn = null;
      const updateReady = () => {
        if (evaluated || !checkBtn) return;
        checkBtn.disabled = !(gapWidget.isAllFilled() && Boolean(selectedPos));
      };

      const gapWidget = buildGapInputsWidget(
        wordObj.word,
        item.gapIndices,
        updateReady,
        () => {
          if (!evaluated && checkBtn && !checkBtn.disabled) handleCheck();
          else if (evaluated) handleNext();
        }
      );

      const posButtons = [];
      const posGrid = el('div', { className: 'pos-pills-grid' });
      item.posChoices.forEach((pChoice, idx) => {
        const b = el('button', {
          type: 'button',
          className: 'btn3d pos-choice-pill',
          'aria-pressed': 'false',
          onClick: () => {
            if (evaluated) return;
            selectedPos = pChoice;
            posButtons.forEach((x) => {
              const active = x.pos === pChoice;
              x.btn.setAttribute('aria-pressed', String(active));
              x.btn.classList.toggle('is-selected', active);
            });
            updateReady();
          }
        }, el('span', { className: 'kbd-hint' }, String(idx + 1)), el('span', {}, pChoice));
        posButtons.push({ pos: pChoice, btn: b });
        posGrid.appendChild(b);
      });

      const feedbackText = el('div', { className: 'stack-sm', style: { flex: '1 1 220px' } },
        el('span', { className: 'subtitle-muted' }, 'Fill the 2 missing letters AND select the Part of Speech.')
      );

      checkBtn = el('button', {
        type: 'button',
        className: 'btn3d btn-green btn-lg',
        disabled: true,
        onClick: () => {
          if (!evaluated) handleCheck();
          else handleNext();
        }
      }, 'Check Answer');

      const actionBar = el('div', { className: 'quiz-action-bar' }, feedbackText, checkBtn);

      const answerCard = el('div', { className: 'card3d quiz-answer-card' },
        el('div', { className: 'stack-sm' },
          el('h2', { style: { fontSize: '1.15rem' } }, '1. Fill the 2 Missing Letters'),
          gapWidget.wrap
        ),
        el('div', { className: 'pos-picker-section' },
          el('strong', {}, '2. Pick the Part of Speech'),
          posGrid
        ),
        actionBar
      );

      function handleCheck() {
        if (evaluated) return;
        evaluated = true;

        const typedWord = gapWidget.reconstructWord();
        const spellingOk = typedWord.toLowerCase() === wordObj.word.toLowerCase();
        const posOk = selectedPos === wordObj.partOfSpeech;

        gapWidget.inputs.forEach(({ input, expected }) => {
          input.readOnly = true;
          const ok = input.value.trim().toLowerCase() === expected.toLowerCase();
          input.classList.add(ok ? 'is-correct' : 'is-wrong');
        });

        posButtons.forEach(({ pos, btn }) => {
          if (pos === wordObj.partOfSpeech) btn.classList.add('is-correct');
          else if (pos === selectedPos && !posOk) btn.classList.add('is-wrong');
        });

        const evalRes = LearningEngine.recordEvaluation({
          unitId: unit.id,
          wordObj,
          spellingCorrect: spellingOk,
          posCorrect: posOk,
          typedSpelling: typedWord,
          chosenPOS: selectedPos,
          mode: 'memories-mini-quiz',
          responseMs: performance.now() - qStart,
          baseXp: XP_REWARDS.MINI_QUIZ_CORRECT
        });

        clearNode(mascotSlot);
        clearNode(feedbackText);

        if (evalRes.fullyCorrect) {
          mq.correctCount++;
          actionBar.classList.add('state-correct');
          if (evalRes.graduated) {
            SoundEngine.playMastery();
            triggerConfetti(28);
            mascotSlot.appendChild(createBeeMascot('celebrate', 84));
            feedbackText.append(
              el('strong', {}, `"${wordObj.word}" Graduated to Mastered! (+${evalRes.xpEarned} XP)`),
              el('span', { className: 'subtitle-muted' }, `3/3 recovery complete · ${wordObj.partOfSpeech}`)
            );
          } else {
            SoundEngine.playCorrect();
            mascotSlot.appendChild(createBeeMascot('happy', 84));
            const stInfo = evalRes.updatedRecord.status === 'recovering'
              ? `Recovery progress: ${evalRes.updatedRecord.mistakeStreakRecovery}/3`
              : 'Spot-on spelling & Part of Speech!';
            feedbackText.append(
              el('strong', {}, `Awesome! +${evalRes.xpEarned} XP`),
              el('span', { className: 'subtitle-muted' }, stInfo)
            );
          }
        } else {
          SoundEngine.playWrong();
          actionBar.classList.add('state-wrong');
          mascotSlot.appendChild(createBeeMascot('wrong', 84));
          feedbackText.append(
            el('strong', {}, `Correct answer: "${wordObj.word}" (${wordObj.partOfSpeech})`),
            el('span', { className: 'subtitle-muted' }, 'Added to 3-strike recovery (0/3) — you will rescue it soon!')
          );
        }

        checkBtn.disabled = false;
        checkBtn.textContent = mq.qIndex < mq.questions.length - 1 ? 'Next Word →' : 'Continue Deck →';
        updateHudUI();
      }

      function handleNext() {
        if (mq.qIndex < mq.questions.length - 1) {
          mq.qIndex++;
          renderCurrentScreen();
          return;
        }
        // Mini-quiz completed!
        DriveSyncManager.flushNow({ pullManifest: false });
        if (mq.isEndOfDeck) {
          AppState.miniQuizSession = null;
          finishMemoriesDeckCelebration(unit);
          return;
        }
        AppState.miniQuizSession = null;
        if (AppState.memoriesSession) {
          const curCard = AppState.memoriesSession.deck[AppState.memoriesSession.cardIndex];
          if (curCard && !AppState.memoriesSession.batchWordIds.includes(curCard.id)) {
            AppState.memoriesSession.batchWordIds.push(curCard.id);
          }
          AppState.memoriesSession.fiveWordCounter = AppState.memoriesSession.batchWordIds.length;
          persistMemoriesBookmark();
        }
        showToast(`Mini-Quiz Score: ${mq.correctCount}/${mq.questions.length}!`);
        navigate('memories', { unitId: unit.id });
      }

      stage.append(promptCard, answerCard);
      container.appendChild(stage);

      if (gapWidget.inputs[0]) {
        setTimeout(() => gapWidget.inputs[0].input.focus(), 60);
      }

      const onKey = (ev) => {
        if (document.querySelector('dialog[open]')) return;
        const tag = ev.target && ev.target.tagName;
        if (!evaluated && tag !== 'INPUT' && ['1', '2', '3', '4'].includes(ev.key)) {
          const idx = Number(ev.key) - 1;
          if (posButtons[idx]) posButtons[idx].btn.click();
        } else if (evaluated && (ev.key === 'Enter' || ev.code === 'Space') && !isImeComposing(ev)) {
          ev.preventDefault();
          handleNext();
        }
      };
      window.addEventListener('keydown', onKey);
      registerScreenCleanup(() => window.removeEventListener('keydown', onKey));
    }

    /* ------------------------------------------------------------------------
       SCREEN F: MODE 2 — QUIZ SETUP (Section 5.2)
       ------------------------------------------------------------------------ */
    function startQuizSession(unitId, { count, difficulty, posFilter, subMode, forcedWordIds = null }) {
      const unit = AppState.unitsById[unitId];
      if (!unit) return;

      const selectedWords = LearningEngine.buildQuizQuestions(unit, {
        count,
        difficulty,
        posFilter,
        forcedWordIds
      });

      if (!selectedWords.length) {
        showToast('No words match those filters — try relaxing difficulty or Part of Speech.');
        return;
      }

      const questions = selectedWords.map((w) => {
        const targetGapCount = w.difficulty === 'hard' ? 4 : (w.difficulty === 'medium' ? 3 : 2);
        const distractors = buildThreeDistractors(w.word, w.distractors);
        return {
          wordObj: w,
          mcqTiles: LearningEngine.shuffle([w.word, ...distractors]),
          gapIndices: LearningEngine.pickGapIndices(w.word, targetGapCount),
          posChoices: LearningEngine.buildPosChoices(w.partOfSpeech)
        };
      });

      AppState.quizSession = {
        unitId,
        subMode, // 'mcq' | 'gaps' | 'bee'
        questions,
        qIndex: 0,
        correctCount: 0,
        answerStreak: 0,
        xpEarned: 0,
        graduatedWords: [],
        missedItems: []
      };

      navigate('quizPlay', { unitId });
    }

      );

      let chosenDiff = saved.difficulty || 'all';

      const persistQuizPrefs = () => {

          defaultQuiz: {

            }, '← Unit Home'),

        ));

        ));

        // 2. Difficulty
        const diffGroup = el('div', { className: 'chip-group' });

            chosenPosSet.clear();
            persistQuizPrefs();
            redraw();

        }, 'All Parts of Speech'));

        const unitPosPresent = new Set(unit.words.map((w) => w.partOfSpeech));
        POS_LIST.forEach((p) => {

                chosenDiff = 'all';

                redraw();

        wrapper.appendChild(el('h2', { style: { fontSize: '1.25rem' } }, '4. Choose Quiz Sub-Mode & Launch'));

        const subModes = [
          {
            id: 'mcq',
            badgeBg: 'var(--blue-soft)',
            badgeBorder: 'var(--sky-blue-lip)',
            title: '1. Multiple Choices',
            desc: 'See the illustration & meaning, spot the true spelling among realistic distractors, and pick the Part of Speech.'

            badgeBorder: 'var(--royal-purple-lip)',

            el('button', {
              type: 'button',
              className: 'btn3d btn-green btn-block',
              disabled: matchingWords.length === 0,
              onClick: () => {
                chosenSubMode = sm.id;

       SCREEN G: MODE 2 — QUIZ PLAY (All 3 Sub-Modes + Mandatory POS Selection)
       ------------------------------------------------------------------------ */

      const qs = AppState.quizSession;
      const unit = qs ? AppState.unitsById[qs.unitId] : null;
      if (!qs || !unit || !qs.questions[qs.qIndex]) {
        navigate('unitHome');
        return;
      }

      const item = qs.questions[qs.qIndex];
      const wordObj = item.wordObj;
      const subMode = qs.subMode;
      const qStart = performance.now();

      if (qs.questions[qs.qIndex + 1]) {
        preloadWordImage(qs.questions[qs.qIndex + 1].wordObj);
        TTSManager.prefetch(qs.questions[qs.qIndex + 1].wordObj.word);
      }

      let selectedMcqWord = '';
      let selectedPos = '';
      let evaluated = false;
      let showBeeSentenceHint = false;

      const subModeTitle =
        subMode === 'mcq' ? 'Multiple Choices' : (subMode === 'gaps' ? 'Fill in the Gaps' : 'Spelling Bee');

      const pctDone = Math.round((qs.qIndex / qs.questions.length) * 100);

      container.appendChild(el('div', { className: 'screen-header' },
        el('div', { className: 'row-wrap' },
          el('button', {
            type: 'button',
            className: 'btn3d btn-sm',
            onClick: () => navigate('unitHome', { unitId: unit.id })
          }, 'Quit Quiz'),
          el('span', { className: 'pill-stat' }, subModeTitle),
          el('span', { className: 'pill-stat' }, `Q ${qs.qIndex + 1} / ${qs.questions.length}`)

        qs.answerStreak >= 3

          : null
      ));

      container.appendChild(el('div', { className: 'progress-track', style: { marginBottom: '1rem' } },
        el('div', { className: 'progress-fill', style: { width: pctDone + '%' } })
      ));

      const stage = el('div', { className: 'quiz-stage split-capable' });

      // Mascot slot reacts to streak, listening, right, or wrong!
      const initialMascotState = subMode === 'bee' ? 'listening' : (qs.answerStreak >= 3 ? 'happy' : 'idle');
      const mascotSlot = el('div', {}, createBeeMascot(initialMascotState, 88));

          clearNode(mascotSlot);
          mascotSlot.appendChild(createBeeMascot(speaking ? 'listening' : 'thinking', 88));
        });
        registerScreenCleanup(() => TTSManager.setListener(null));
      }

      // Left / Top Prompt Card
      const promptCard = el('div', { className: 'card3d quiz-prompt-card', style: { alignItems: 'center', textAlign: 'center' } }, mascotSlot);

      const blankedExample = LearningEngine.blankWordInSentence(wordObj.exampleSentence, wordObj.word);
      const quizThaiHint = wordObj.meaningThai || ThaiTranslator.getCached(wordObj.word);

      if (subMode === 'mcq' || subMode === 'gaps') {
        promptCard.appendChild(el('div', { className: 'word-img-frame' },
          createResilientWordImage(wordObj, { hideWordText: true })
        ));
        promptCard.appendChild(el('div', { className: 'meaning-box' },
          quizThaiHint
            ? el('div', {
                style: {
                  fontSize: '0.98rem',
                  fontWeight: '700',
                  color: 'var(--honey-dark)',
                  marginBottom: '0.35rem',
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '0.35rem'
                }
              },
                el('span', { className: 'thai-flag-badge' }, 'TH'),
                el('span', {}, quizThaiHint)
              )
            : null,
          el('div', {}, wordObj.meaning)
        ));
        if (subMode === 'gaps') {
          promptCard.appendChild(el('div', { className: 'example-box' }, `"${blankedExample}"`));
        }
        promptCard.appendChild(el('div', { className: 'row-wrap', style: { justifyContent: 'center' } },
          el('button', {
            type: 'button',
            className: 'btn3d btn-blue btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: false })
          }, createIcon3D('speaker', 18), el('span', {}, 'Listen')),
          el('button', {
            type: 'button',
            className: 'btn3d btn-sm',
            onClick: () => TTSManager.speak(wordObj.word, { slow: true })
          }, createIcon3D('turtle', 18), el('span', {}, 'Slow'))
        ));
      } else {
        // Sub-Mode 3: Spelling Bee (Audio-First + Unambiguous Meaning & Toggleable Context Sentence)
        const sentenceBox = el('div', { className: 'example-box', hidden: !showBeeSentenceHint }, `"${blankedExample}"`);
        const toggleHintBtn = el('button', {
          type: 'button',
          className: 'btn3d btn-sm',
          onClick: () => {
            showBeeSentenceHint = !showBeeSentenceHint;
            sentenceBox.hidden = !showBeeSentenceHint;
            toggleHintBtn.textContent = showBeeSentenceHint ? 'Hide Blanked Sentence' : 'Show Blanked Sentence';
          }
        }, 'Show Blanked Sentence');

        promptCard.append(
          el('div', { className: 'row-wrap', style: { justifyContent: 'center' } },
            el('button', {
              type: 'button',
              className: 'btn3d btn-blue btn-lg',
              onClick: () => TTSManager.speak(wordObj.word, { slow: false })
            }, createIcon3D('speaker', 22), el('span', {}, 'Replay Word')),
            el('button', {
              type: 'button',
              className: 'btn3d btn-gold',
              onClick: () => TTSManager.speak(wordObj.word, { slow: true })
            }, createIcon3D('turtle', 20), el('span', {}, 'Slow Replay'))
          ),
          el('div', { className: 'row-wrap', style: { justifyContent: 'center' } },
            el('button', {
              type: 'button',
              className: 'btn3d btn-sm',
              onClick: () => TTSManager.speak(wordObj.exampleSentence, { slow: false })
            }, 'Hear in a Sentence'),
            toggleHintBtn
          ),
          el('div', { className: 'meaning-box' },
            quizThaiHint
              ? el('div', {
                  style: {
                    fontSize: '0.98rem',
                    fontWeight: '700',
                    color: 'var(--honey-dark)',
                    marginBottom: '0.35rem',
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: '0.35rem'
                  }
                },
                  el('span', { className: 'thai-flag-badge' }, 'TH'),
                  el('span', {}, quizThaiHint)
                )
              : null,
            el('div', {}, wordObj.meaning)
          ),
          sentenceBox
        );
      }

      // Right / Bottom Interactive Answer Card
      let checkBtn = null;
      let gapWidget = null;
      let beeInput = null;
      const mcqButtons = [];
      const posButtons = [];

      const isSpellingAnswered = () => {
        if (subMode === 'mcq') return Boolean(selectedMcqWord);
        if (subMode === 'gaps') return gapWidget ? gapWidget.isAllFilled() : false;
        return beeInput ? beeInput.value.trim().length > 0 : false;
      };

      const updateCheckState = () => {
        if (evaluated || !checkBtn) return;
        checkBtn.disabled = !(isSpellingAnswered() && Boolean(selectedPos));
      };

      const spellingSection = el('div', { className: 'stack-sm' });

      if (subMode === 'mcq') {
        spellingSection.appendChild(el('h2', { style: { fontSize: '1.12rem' } }, '1. Pick the Correct Spelling'));
        const grid = el('div', { className: 'choices-grid' });
        item.mcqTiles.forEach((tileWord, idx) => {
          const b = el('button', {
            type: 'button',
            className: 'btn3d choice-tile',
            'aria-pressed': 'false',
            onClick: () => {
              if (evaluated) return;
              selectedMcqWord = tileWord;
              mcqButtons.forEach((x) => {
                const active = x.word === tileWord;
                x.btn.setAttribute('aria-pressed', String(active));
                x.btn.classList.toggle('is-selected', active);
              });
              updateCheckState();
            }
          }, el('span', { className: 'kbd-hint' }, String(idx + 1)), el('span', {}, tileWord));
          mcqButtons.push({ word: tileWord, btn: b });
          grid.appendChild(b);
        });
        spellingSection.appendChild(grid);
      } else if (subMode === 'gaps') {
        spellingSection.appendChild(el('h2', { style: { fontSize: '1.12rem' } }, '1. Fill in the Missing Letters'));
        gapWidget = buildGapInputsWidget(
          wordObj.word,
          item.gapIndices,
          updateCheckState,
          () => {
            if (!evaluated && checkBtn && !checkBtn.disabled) handleCheck();
            else if (evaluated) handleNext();
          }
        );
        spellingSection.appendChild(gapWidget.wrap);
      } else {
        spellingSection.appendChild(el('label', { for: 'bee-full-spelling-input', className: 'field-label', style: { fontSize: '1.12rem' } },
          '1. Type the Exact Spelling'
        ));
        beeInput = el('input', {
          id: 'bee-full-spelling-input',
          type: 'text',
          className: 'input3d bee-spell-input',
          placeholder: 'Type the word you hear...',
          autocomplete: 'off',
          autocorrect: 'off',
          autocapitalize: 'none',
          spellcheck: 'false',
          enterkeyhint: 'done',
          onInput: updateCheckState,
          onKeydown: (ev) => {
            if (ev.key === 'Enter' && !isImeComposing(ev)) {
              ev.preventDefault();
              if (!evaluated && checkBtn && !checkBtn.disabled) handleCheck();
              else if (evaluated) handleNext();
            }
          }
        });
        spellingSection.appendChild(beeInput);
      }

      // Mandatory Part of Speech 4-Pill Picker
      const posGrid = el('div', { className: 'pos-pills-grid' });
      const posShortcutKeys = ['Q', 'W', 'E', 'R'];
      item.posChoices.forEach((pChoice, idx) => {
        const b = el('button', {
          type: 'button',
          className: 'btn3d pos-choice-pill',
          'aria-pressed': 'false',
          onClick: () => {
            if (evaluated) return;
            selectedPos = pChoice;
            posButtons.forEach((x) => {
              const active = x.pos === pChoice;
              x.btn.setAttribute('aria-pressed', String(active));
              x.btn.classList.toggle('is-selected', active);
            });
            updateCheckState();
          }
        },
          el('span', { className: 'kbd-hint' }, subMode === 'mcq' ? posShortcutKeys[idx] : String(idx + 1)),
          el('span', {}, pChoice)
        );
        posButtons.push({ pos: pChoice, btn: b });
        posGrid.appendChild(b);
      });

      const posSection = el('div', { className: 'pos-picker-section' },
        el('strong', {}, '2. Select the Word’s Part of Speech'),
        posGrid
      );

      const feedbackBox = el('div', { className: 'stack-sm', style: { flex: '1 1 220px' } },
        el('span', { className: 'subtitle-muted' }, 'Answer both Spelling and Part of Speech to check.')
      );

      checkBtn = el('button', {
        type: 'button',
        className: 'btn3d btn-green btn-lg',
        disabled: true,
        onClick: () => {
          if (!evaluated) handleCheck();
          else handleNext();
        }
      }, 'Check Answer');

      const actionBar = el('div', { className: 'quiz-action-bar' }, feedbackBox, checkBtn);
      const answerCard = el('div', { className: 'card3d quiz-answer-card' }, spellingSection, posSection, actionBar);

      function handleCheck() {
        if (evaluated) return;
        evaluated = true;

        let typedSpelling = '';
        if (subMode === 'mcq') typedSpelling = selectedMcqWord;
        else if (subMode === 'gaps') typedSpelling = gapWidget.reconstructWord();
        else typedSpelling = beeInput.value.trim();

        const spellingOk = typedSpelling.trim().toLowerCase() === wordObj.word.trim().toLowerCase();
        const posOk = selectedPos === wordObj.partOfSpeech;

        // Visual feedback on inputs / tiles
        if (subMode === 'mcq') {
          mcqButtons.forEach(({ word, btn }) => {
            if (word.toLowerCase() === wordObj.word.toLowerCase()) btn.classList.add('is-correct');
            else if (word === selectedMcqWord && !spellingOk) btn.classList.add('is-wrong');
          });
        } else if (subMode === 'gaps') {
          gapWidget.inputs.forEach(({ input, expected }) => {
            input.readOnly = true;
            input.classList.add(input.value.trim().toLowerCase() === expected.toLowerCase() ? 'is-correct' : 'is-wrong');
          });
        } else if (beeInput) {
          beeInput.readOnly = true;
          beeInput.style.borderColor = spellingOk ? 'var(--feather-green)' : 'var(--cardinal-red)';
        }

        posButtons.forEach(({ pos, btn }) => {
          if (pos === wordObj.partOfSpeech) btn.classList.add('is-correct');
          else if (pos === selectedPos && !posOk) btn.classList.add('is-wrong');
        });

        const evalRes = LearningEngine.recordEvaluation({
          unitId: unit.id,
          wordObj,
          spellingCorrect: spellingOk,
          posCorrect: posOk,
          typedSpelling,
          chosenPOS: selectedPos,
          mode: `quiz:${subMode}`,
          responseMs: performance.now() - qStart,
          baseXp: XP_REWARDS.QUIZ_CORRECT
        });

        qs.xpEarned += evalRes.xpEarned;
        clearNode(mascotSlot);
        clearNode(feedbackBox);

        if (evalRes.fullyCorrect) {
          qs.correctCount++;
          qs.answerStreak++;
          actionBar.classList.add('state-correct');

          if (evalRes.graduated) {
            qs.graduatedWords.push(wordObj.word);
            SoundEngine.playMastery();
            triggerConfetti(30);
            mascotSlot.appendChild(createBeeMascot('celebrate', 88));
            feedbackBox.append(
              el('strong', {}, `Mastered "${wordObj.word}"! (+${evalRes.xpEarned} XP)`),
              el('span', { className: 'subtitle-muted' }, `Graduated to Mastered · ${wordObj.partOfSpeech}`)
            );
          } else {
            SoundEngine.playCorrect();
            mascotSlot.appendChild(createBeeMascot('happy', 88));
            const detail = evalRes.updatedRecord.status === 'recovering'
              ? `3-strike recovery: ${evalRes.updatedRecord.mistakeStreakRecovery}/3`
              : (qs.answerStreak >= 3 ? `${qs.answerStreak} correct in a row!` : 'Great job!');
            feedbackBox.append(
              el('strong', {}, `Correct! +${evalRes.xpEarned} XP`),
              el('span', { className: 'subtitle-muted' }, detail)
            );
          }
        } else {
          qs.answerStreak = 0;
          qs.missedItems.push({
            wordObj,
            typedSpelling,
            chosenPOS: selectedPos,
            spellingOk,
            posOk
          });
          SoundEngine.playWrong();
          actionBar.classList.add('state-wrong');
          mascotSlot.appendChild(createBeeMascot('wrong', 88));

          const detailParts = [];
          if (!spellingOk) detailParts.push(`Spelling: "${wordObj.word}" (you answered "${typedSpelling}")`);
          if (!posOk) detailParts.push(`Part of Speech: ${wordObj.partOfSpeech} (you picked ${selectedPos})`);
          feedbackBox.append(
            el('strong', {}, 'Almost! Let’s review the right answer:'),
            el('span', { className: 'subtitle-muted' }, detailParts.join(' · '))
          );
        }

        checkBtn.disabled = false;
        checkBtn.textContent = qs.qIndex < qs.questions.length - 1 ? 'Next Question →' : 'See Quiz Results →';
        updateHudUI();
      }

      function handleNext() {
        if (qs.qIndex < qs.questions.length - 1) {
          qs.qIndex++;
          renderCurrentScreen();
          return;
        }
        // Quiz finished! Award completion bonus & flush Drive sync immediately
        AppState.progress.xp = (Number(AppState.progress.xp) || 0) + XP_REWARDS.QUIZ_COMPLETE_BONUS;
        qs.xpEarned += XP_REWARDS.QUIZ_COMPLETE_BONUS;
        DataStore.saveProgress({ flushImmediate: true });

        AppState.lastQuizResults = {
          unitId: unit.id,
          subMode,
          total: qs.questions.length,
          correct: qs.correctCount,
          xpEarned: qs.xpEarned,
          graduatedWords: [...new Set(qs.graduatedWords)],
          missedItems: qs.missedItems
        };
        AppState.quizSession = null;
        navigate('quizResults', { unitId: unit.id });
      }

      stage.append(promptCard, answerCard);
      container.appendChild(stage);

      // Focus input & auto-speak in Spelling Bee mode
      setTimeout(() => {
        if (subMode === 'gaps' && gapWidget && gapWidget.inputs[0]) {
          gapWidget.inputs[0].input.focus();
        } else if (subMode === 'bee' && beeInput) {
          beeInput.focus();
          TTSManager.speak(wordObj.word, { slow: false });
        }
      }, 80);

      // Desktop keyboard shortcuts
      const onKey = (ev) => {
        if (document.querySelector('dialog[open]')) return;
        const tag = ev.target && ev.target.tagName;
        const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

        if (evaluated) {
          if ((ev.key === 'Enter' || (!inInput && ev.code === 'Space')) && !isImeComposing(ev)) {
            ev.preventDefault();
            handleNext();
          }
          return;
        }

        if (!inInput) {
          if (subMode === 'mcq') {
            if (['1', '2', '3', '4'].includes(ev.key)) {
              const idx = Number(ev.key) - 1;
              if (mcqButtons[idx]) mcqButtons[idx].btn.click();
            } else if (['q', 'w', 'e', 'r', 'Q', 'W', 'E', 'R'].includes(ev.key)) {
              const idx = ['q', 'w', 'e', 'r'].indexOf(ev.key.toLowerCase());
              if (posButtons[idx]) posButtons[idx].btn.click();
            }
          } else if (['1', '2', '3', '4'].includes(ev.key)) {
            const idx = Number(ev.key) - 1;
            if (posButtons[idx]) posButtons[idx].btn.click();
          }

          if (ev.code === 'Space') {
            ev.preventDefault();
            TTSManager.speak(wordObj.word, { slow: false });
          } else if (ev.key === 'Enter' && checkBtn && !checkBtn.disabled) {
            ev.preventDefault();
            handleCheck();
          }
        }
      };
      window.addEventListener('keydown', onKey);
      registerScreenCleanup(() => window.removeEventListener('keydown', onKey));
    }

    /* ------------------------------------------------------------------------
       SCREEN H: QUIZ RESULTS (Section 5.2)
       ------------------------------------------------------------------------ */
    function renderQuizResultsScreen(container) {
      const res = AppState.lastQuizResults;
      const unit = res ? AppState.unitsById[res.unitId] : null;
      if (!res || !unit) {
        navigate('unitsHub');
        return;
      }

      const accuracy = res.total ? Math.round((res.correct / res.total) * 100) : 0;
      SoundEngine.playMastery();
      triggerConfetti(50);

      const heroCard = el('div', { className: 'card3d stack-md', style: { alignItems: 'center', textAlign: 'center', padding: '1.8rem 1.25rem' } },
        createBeeMascot('celebrate', 108),
        el('h1', { className: 'screen-title' },
          accuracy === 100 ? 'Perfect Spelling Bee Score!' : (accuracy >= 75 ? 'Great Quiz Session!' : 'Awesome Effort — Keep Growing!')
        ),
        el('p', { className: 'subtitle-muted' }, unit.name),
        el('div', { className: 'row-wrap', style: { justifyContent: 'center', gap: '0.75rem' } },
          el('span', { className: 'pill-stat' }, `Score: ${res.correct} / ${res.total}`),
          el('span', { className: 'pill-stat' }, `Accuracy: ${accuracy}%`),
          el('span', { className: 'pill-stat', style: { background: 'var(--honey-soft)', borderColor: 'var(--honey-gold-lip)' } },
            `+${res.xpEarned} XP Earned`
          )
        ),
        el('div', { className: 'row-wrap', style: { justifyContent: 'center', marginTop: '0.4rem' } },
          res.missedItems.length > 0
            ? el('button', {
                type: 'button',
                className: 'btn3d btn-amber btn-lg',
                onClick: () => {
                  const missedIds = [...new Set(res.missedItems.map((m) => m.wordObj.id))];
                  startQuizSession(unit.id, {
                    count: 'all',
                    difficulty: 'all',
                    posFilter: [],
                    subMode: res.subMode,
                    forcedWordIds: missedIds
                  });
                }
              }, `Practice Mistakes (${res.missedItems.length})`)
            : null,
          el('button', {
            type: 'button',
            className: 'btn3d btn-green btn-lg',
            onClick: () => navigate('unitHome', { unitId: unit.id })
          }, 'Back to Unit'),
          el('button', {
            type: 'button',
            className: 'btn3d btn-purple',
            onClick: () => openAnalyticsDrawer('coach')
          }, 'AI Coach Insights')
        )
      );
      container.appendChild(heroCard);

      if (res.graduatedWords.length > 0) {
        const gradChips = el('div', { className: 'row-wrap' });
        res.graduatedWords.forEach((w) => {
          gradChips.appendChild(el('span', {
            className: 'pill-stat',
            style: { background: 'var(--green-soft)', borderColor: 'var(--feather-green)' }
          }, w));
        });
        container.appendChild(el('div', { className: 'card3d stack-sm', style: { marginTop: '1rem' } },
          el('h2', { style: { fontSize: '1.15rem' } }, 'Words Graduated to Mastered'),
          gradChips
        ));
      }

      if (res.missedItems.length > 0) {
        const missedList = el('div', { className: 'stack-sm' });
        res.missedItems.forEach((m) => {
          missedList.appendChild(el('div', {
            className: 'card3d row-between',
            style: { padding: '0.85rem 1rem', background: 'var(--red-soft)', borderColor: 'var(--cardinal-red)' }
          },
            el('div', { className: 'stack-sm' },
              el('div', { className: 'row-wrap' },
                el('strong', { style: { fontSize: '1.1rem' } }, m.wordObj.word),
                el('span', { className: 'pos-badge' }, m.wordObj.partOfSpeech)
              ),
              el('span', { className: 'subtitle-muted', style: { fontSize: '0.86rem' } },
                `Your answer: "${m.typedSpelling}" · POS: ${m.chosenPOS} — ${m.wordObj.meaning}`
              )
            ),
            el('button', {
              type: 'button',
              className: 'btn3d btn-blue btn-sm',
              onClick: () => TTSManager.speak(m.wordObj.word, { slow: false })
            }, createIcon3D('speaker', 18), el('span', {}, 'Hear'))
          ));
        });

        container.appendChild(el('div', { className: 'card3d stack-md', style: { marginTop: '1rem' } },
          el('h2', { style: { fontSize: '1.15rem' } }, 'Missed Words (Added to 3-Strike Recovery)'),
          missedList
        ));
      }
    }

    /* ========================================================================
       13. MODALS: CREATE/EDIT UNIT, FRIEND IMPORT, VAULT & ANALYTICS DRAWER
       ======================================================================== */

    /* ------------------------------------------------------------------------
       MODAL 1: CREATE / EDIT / IMPORT UNIT (Section 4.2 & 4.3)
       ------------------------------------------------------------------------ */
    let unitModalDirty = false;

    function openUnitModal(existingUnit = null) {
      const dlg = byId('unit-modal');
      const titleEl = byId('unit-modal-title');
      const body = byId('unit-modal-body');
      const footer = byId('unit-modal-footer');
      if (!dlg || !titleEl || !body || !footer) return;

      const isEditing = Boolean(existingUnit);
      titleEl.textContent = isEditing ? `Edit Unit: ${existingUnit.name}` : 'Create / Import Vocabulary Unit';

      let unitName = isEditing ? existingUnit.name : '';
      let activeTab = 'paste'; // 'paste' | 'ai'
      let draftWords = isEditing
        ? existingUnit.words.map((w) => Object.assign({}, w, { distractors: [...(w.distractors || [])] }))
        : [];
      let rawJsonDraft = isEditing ? JSON.stringify(DataStore.toCanonicalUnitFile(existingUnit).words, null, 2) : '';
      let parseNotice = isEditing ? `Loaded ${draftWords.length} word(s).` : '';
      let parseError = '';
      let aiFiles = [];
      let aiNotes = '';
      let aiBusy = false;
      unitModalDirty = false;

      const redrawModal = () => {
        clearNode(body);
        clearNode(footer);

        // Unit Name Field
        const nameInput = el('input', {
          id: 'unit-name-input',
          type: 'text',
          className: 'input3d',
          placeholder: 'e.g. Unit 1: Biology Chapter 3',
          value: unitName,
          maxlength: '90',
          onInput: () => {
            unitName = nameInput.value;
            unitModalDirty = true;
          }
        });

        body.appendChild(el('div', { className: 'field-group' },
          el('label', { for: 'unit-name-input', className: 'field-label' }, 'Unit Name'),
          nameInput
        ));

        // Workflow Tabs (Paste JSON or Auto-Extract via Key)
        const tabs = el('div', { className: 'tab-bar', role: 'tablist' },
          el('button', {
            type: 'button',
            role: 'tab',
            className: 'btn3d tab-btn',
            'aria-selected': String(activeTab === 'paste'),
            onClick: () => { activeTab = 'paste'; redrawModal(); }
          }, '1. Gemini Website → JSON'),
          el('button', {
            type: 'button',
            role: 'tab',
            className: 'btn3d tab-btn',
            'aria-selected': String(activeTab === 'ai'),
            onClick: () => { activeTab = 'ai'; redrawModal(); }
          }, '2. Auto-Extract via Key')
        );
        body.appendChild(tabs);

        if (parseError) {
          body.appendChild(el('div', { className: 'banner-msg banner-error' }, parseError));
        } else if (parseNotice) {
          body.appendChild(el('div', { className: 'banner-msg banner-success' }, parseNotice));
        }

        if (activeTab === 'paste') {
          // 3-step visual instruction guide + Copy Prompt button
          body.appendChild(el('div', { className: 'card3d stack-sm', style: { background: 'var(--honey-soft)', borderColor: 'var(--honey-gold-lip)' } },
            el('strong', {}, 'How it works in 3 quick steps:'),
            el('p', { style: { fontSize: '0.9rem' } },
              'Step 1: Click "1. Copy Prompt for Gemini Website" below · Step 2: Open Gemini, attach photos of your worksheet/test/textbook & paste the prompt · Step 3: Copy Gemini’s JSON code block and paste it below!'
            ),
            el('p', { className: 'subtitle-muted', style: { fontSize: '0.82rem' } },
              'Pro tip: If photographing tiny or shadowed worksheet print in the Gemini app, switch the model picker from "Flash-Lite" to "Flash" or "Pro" for sharpest OCR.'
            ),
            el('div', { className: 'row-wrap' },
              el('button', {
                type: 'button',
                className: 'btn3d btn-gold',
                onClick: async () => {
                  const ok = await copyTextSafe(GEMINI_EXTRACTOR_PROMPT);
                  showToast(ok ? 'Copied! Paste into gemini.google.com with your study photos.' : 'Clipboard blocked — select & copy manually');
                }
              }, '1. Copy Prompt for Gemini Website'),
              el('a', {
                href: 'https://gemini.google.com',
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'btn3d btn-sm'
              }, '↗ Open gemini.google.com')
            )
          ));

          const jsonTextarea = el('textarea', {
            id: 'unit-json-textarea',
            className: 'textarea3d',
            placeholder: 'Paste the [ { "word": "...", "partOfSpeech": "...", ... } ] JSON from Gemini here...',
            onInput: () => {
              rawJsonDraft = jsonTextarea.value;
              unitModalDirty = true;
            }
          });
          jsonTextarea.value = rawJsonDraft;

          const applyParsedResult = (res) => {
            if (!res.ok) {
              parseError = res.error;
              parseNotice = '';
              redrawModal();
              return;
            }
            draftWords = res.words;
            if (!unitName.trim() && res.suggestedName) {
              unitName = res.suggestedName;
            }
            const extras = [];
            if (res.skippedCount > 0) extras.push(`${res.skippedCount} duplicate/invalid skipped`);
            if (res.inferredCount > 0) extras.push(`${res.inferredCount} Part(s) of Speech inferred (?)`);
            parseError = '';
            parseNotice = `${res.words.length} Vocabulary Words Ready to Import!${extras.length ? ' (' + extras.join(', ') + ')' : ''}`;
            unitModalDirty = true;
            rawJsonDraft = JSON.stringify(draftWords, null, 2);
            redrawModal();
          };

          const fileInput = el('input', {
            type: 'file',
            accept: '.json,application/json,text/plain',
            hidden: true,
            onChange: () => {
              const f = fileInput.files && fileInput.files[0];
              if (!f) return;
              const reader = new FileReader();
              reader.onload = () => {
                rawJsonDraft = String(reader.result || '');
                if (!unitName.trim()) {
                  unitName = f.name.replace(/\.json$/i, '').replace(/[_-]+/g, ' ');
                }
                applyParsedResult(VocabularyParser.parseAndSanitize(rawJsonDraft, existingUnit));
              };
              reader.readAsText(f);
            }
          });

          const dropzone = el('div', { className: 'dropzone' },
            fileInput,
            el('button', {
              type: 'button',
              className: 'btn3d btn-blue btn-sm',
              onClick: async () => {
                try {
                  if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') {
                    showToast('Clipboard read unavailable — tap inside the box and Paste (Ctrl+V / Long-press).');
                    jsonTextarea.focus();
                    return;
                  }
                  const clip = await navigator.clipboard.readText();
                  if (!clip.trim()) {
                    showToast('Clipboard is empty.');
                    return;
                  }
                  rawJsonDraft = clip;
                  applyParsedResult(VocabularyParser.parseAndSanitize(rawJsonDraft, existingUnit));
                } catch (_) {
                  showToast('Browser asked to paste manually — press Ctrl+V inside the JSON box.');
                  jsonTextarea.focus();
                }
              }
            }, 'Paste from Clipboard'),
            el('button', {
              type: 'button',
              className: 'btn3d btn-sm',
              onClick: () => fileInput.click()
            }, 'Upload .json File'),
            el('span', { className: 'subtitle-muted', style: { fontSize: '0.84rem' } }, 'or drag & drop a .json file here')
          );

          dropzone.addEventListener('dragover', (ev) => {
            ev.preventDefault();
            dropzone.classList.add('is-dragover');
          });
          dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-dragover'));
          dropzone.addEventListener('drop', (ev) => {
            ev.preventDefault();
            dropzone.classList.remove('is-dragover');
            const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              rawJsonDraft = String(reader.result || '');
              if (!unitName.trim()) unitName = f.name.replace(/\.json$/i, '');
              applyParsedResult(VocabularyParser.parseAndSanitize(rawJsonDraft, existingUnit));
            };
            reader.readAsText(f);
          });

          body.append(
            dropzone,
            el('div', { className: 'field-group' },
              el('label', { for: 'unit-json-textarea', className: 'field-label' },
                el('span', {}, '2. Paste .json from Gemini'),
                el('button', {
                  type: 'button',
                  className: 'btn3d btn-purple btn-sm',
                  onClick: () => applyParsedResult(VocabularyParser.parseAndSanitize(rawJsonDraft, existingUnit))
                }, 'Validate & Preview Words →')
              ),
              jsonTextarea
            )
          );
        } else if (activeTab === 'ai') {
          const { geminiKey } = ConfigVault.getEffective();
          if (!geminiKey) {
            body.appendChild(el('div', { className: 'banner-msg banner-warn row-between' },
              el('span', {}, 'Add a Gemini API Key in the Vault to extract photos/notes directly inside the app, or use Tab 1 for free!'),
              el('button', { type: 'button', className: 'btn3d btn-sm', onClick: () => openVaultModal() }, 'Open Vault')
            ));
          }

          const photoPicker = el('input', {
            type: 'file',
            accept: 'image/*',
            multiple: true,
            hidden: true,
            onChange: () => {
              aiFiles = Array.from(photoPicker.files || []).slice(0, 6);
              redrawModal();
            }
          });

          const notesBox = el('textarea', {
            className: 'textarea3d',
            style: { fontFamily: 'var(--font-body)' },
            placeholder: 'Optional: paste raw word lists, textbook paragraphs, or teacher study notes here...',
            onInput: () => { aiNotes = notesBox.value; }
          });
          notesBox.value = aiNotes;

          body.append(
            el('div', { className: 'dropzone' },
              photoPicker,
              el('button', {
                type: 'button',
                className: 'btn3d btn-gold',
                onClick: () => photoPicker.click()
              }, 'Choose Worksheet Photos (up to 6)'),
              el('span', { className: 'subtitle-muted' },
                aiFiles.length ? `${aiFiles.length} photo(s) attached: ${aiFiles.map((f) => f.name).join(', ')}` : 'No photos attached yet'
              )
            ),
            el('div', { className: 'field-group' },
              el('label', { className: 'field-label' }, 'Or Paste Raw Vocabulary / Worksheet Text'),
              notesBox
            ),
            el('button', {
              type: 'button',
              className: 'btn3d btn-purple btn-lg',
              disabled: aiBusy || !geminiKey || (!aiFiles.length && !aiNotes.trim()),
              onClick: async () => {
                aiBusy = true;
                parseError = '';
                redrawModal();
                try {
                  const res = await AICoachEngine.extractVocabularyDirectly({ files: aiFiles, rawText: aiNotes });
                  aiBusy = false;
                  if (!res.ok) {
                    parseError = res.error;
                    redrawModal();
                    return;
                  }
                  draftWords = res.words;
                  rawJsonDraft = JSON.stringify(draftWords, null, 2);
                  parseNotice = `Extracted ${res.words.length} words with Gemini AI! Click Save Unit below to finish.`;
                  unitModalDirty = true;
                  redrawModal();
                } catch (err) {
                  aiBusy = false;
                  parseError = (err && err.message) || 'AI extraction failed. Try Tab 1 (Copy Prompt) instead.';
                  redrawModal();
                }
              }
            }, aiBusy ? 'Gemini is reading your study material...' : 'Extract Vocabulary with Gemini AI')
          );
        }

        // Save Handlers// Save Handlers
        const commitUnit = (startAfterSave) => {
          // Parse and validate draft JSON if provided
          if (rawJsonDraft.trim() && (!draftWords.length || unitModalDirty)) {
            const parsed = VocabularyParser.parseAndSanitize(rawJsonDraft, existingUnit);
            if (!parsed.ok) {
              parseError = parsed.error;
              redrawModal();
              return;
            }
            draftWords = parsed.words;
            if (!unitName.trim() && parsed.suggestedName) unitName = parsed.suggestedName;
          }

          const existingMap = new Map();
          if (existingUnit && Array.isArray(existingUnit.words)) {
            existingUnit.words.forEach((w) => existingMap.set(String(w.word).trim().toLowerCase(), w.id));
          }
          const finalNorm = VocabularyParser.normalizeItems(draftWords, existingMap);
          if (!finalNorm.words.length) {
            parseError = 'Please add or paste at least 1 valid vocabulary word before saving.';
            redrawModal();
            return;
          }

          const cleanTitle = unitName.trim() || `Vocabulary Unit (${new Date().toLocaleDateString()})`;
          const unitId = existingUnit ? existingUnit.id : ('u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6));

          const savedUnit = DataStore.saveUnit({
            id: unitId,
            name: cleanTitle,
            createdAt: existingUnit ? existingUnit.createdAt : Date.now(),
            updatedAt: Date.now(),
            words: finalNorm.words
          }, { flushImmediate: true });

          unitModalDirty = false;
          closeModalDialog(dlg);
          SoundEngine.playCorrect();
          showToast(`Saved "${savedUnit.name}" (${savedUnit.words.length} words)!`);

          if (startAfterSave) {
            navigate('unitHome', { unitId: savedUnit.id });
          } else {
            renderCurrentScreen();
            updateHudUI();
          }
        };

        if (isEditing) {
          footer.appendChild(el('button', {
            type: 'button',
            className: 'btn3d btn-red btn-sm',
            style: { marginRight: 'auto' },
            onClick: async () => {
              const ok = await confirmDialog({
                title: 'Delete Unit?',
                message: `Permanently delete "${existingUnit.name}" (${existingUnit.words.length} words)?`,
                confirmLabel: 'Delete Unit',
                confirmVariant: 'btn-red'
              });
              if (ok) {
                unitModalDirty = false;
                closeModalDialog(dlg);
                DataStore.deleteUnit(existingUnit.id);
                if (AppState.screen === 'unitHome' && AppState.activeUnitId === existingUnit.id) {
                  navigate('unitsHub');
                } else {
                  renderCurrentScreen();
                  updateHudUI();
                }
                showToast('Unit deleted');
              }
            }
          }, createIcon3D('trash', 18), el('span', {}, 'Delete Unit')));
        }

        footer.append(
          el('button', {
            type: 'button',
            className: 'btn3d',
            onClick: () => tryCloseUnitModal()
          }, 'Cancel'),
          el('button', {
            type: 'button',
            className: 'btn3d btn-gold',
            onClick: () => commitUnit(false)
          }, 'Save Unit'),
          el('button', {
            type: 'button',
            className: 'btn3d btn-green',
            onClick: () => commitUnit(true)
          }, 'Save & Start Unit')
        );
      };

      redrawModal();
      openModalDialog(dlg);
    }

    async function tryCloseUnitModal() {
      const dlg = byId('unit-modal');
      if (!dlg || !dlg.open) return;
      if (unitModalDirty) {
        const discard = await confirmDialog({
          title: 'Discard Unsaved Unit Changes?',
          message: 'You have unsaved vocabulary edits in this modal. Discard them?',
          confirmLabel: 'Discard Changes',
          confirmVariant: 'btn-red'
        });
        if (!discard) return;
      }
      unitModalDirty = false;
      closeModalDialog(dlg);
    }
