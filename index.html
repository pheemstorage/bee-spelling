    function closeModalDialog(dlg) {
      if (!dlg) return;
      try {
        if (dlg.open) dlg.close();
      } catch (_) {
        dlg.removeAttribute('open');
      }
    }

    function confirmDialog({ title, message, confirmLabel = 'Confirm', confirmVariant = 'btn-red' }) {
      return new Promise((resolve) => {
        const dlg = byId('confirm-modal');
        const titleEl = byId('confirm-modal-title');
        const msgEl = byId('confirm-modal-msg');
        const okBtn = byId('confirm-ok-btn');
        const cancelBtn = byId('confirm-cancel-btn');
        if (!dlg || !titleEl || !msgEl || !okBtn) {
          resolve(false);
          return;
        }
        titleEl.textContent = title || 'Please Confirm';
        msgEl.textContent = message || 'Are you sure?';
        okBtn.textContent = confirmLabel;
        okBtn.className = 'btn3d ' + confirmVariant;

        let settled = false;
        const cleanupAndResolve = (result) => {
          if (settled) return;
          settled = true;
          okBtn.removeEventListener('click', onOkClick);
          if (cancelBtn) cancelBtn.removeEventListener('click', onCancelClick);
          dlg.removeEventListener('close', onClose);
          closeModalDialog(dlg);
          dlg.returnValue = '';
          resolve(Boolean(result));
        };

        const onOkClick = (e) => {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          cleanupAndResolve(true);
        };

        const onCancelClick = (e) => {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          cleanupAndResolve(false);
        };

        const onClose = () => {
          cleanupAndResolve(dlg.returnValue === 'confirm');
        };

        okBtn.addEventListener('click', onOkClick, { once: true });
        if (cancelBtn) cancelBtn.addEventListener('click', onCancelClick, { once: true });
        dlg.addEventListener('close', onClose, { once: true });
        openModalDialog(dlg);
      });
    }

    async function copyTextSafe(text) {
      const str = String(text || '');
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(str);
          return true;
        }
      } catch (_) {}

      // Fallback for iOS / non-HTTPS / file:// contexts
      try {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, str.length);
        const ok = document.execCommand('copy');
        ta.remove();
        return Boolean(ok);
      } catch (_) {
        return false;
      }
    }

    function triggerConfetti(count = 38) {
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }
        const layer = byId('confetti-layer');
        if (!layer) return;
        const colors = ['#FFC800', '#FF9600', '#58CC02', '#1CB0F6', '#CE82FF', '#FF4B4B'];
        for (let i = 0; i < count; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.round(Math.random() * 98) + '%';
          piece.style.backgroundColor = colors[i % colors.length];
          piece.style.setProperty('--drift-x', Math.round((Math.random() - 0.5) * 200) + 'px');
          piece.style.setProperty('--spin-deg', Math.round(360 + Math.random() * 540) + 'deg');
          piece.style.setProperty('--fall-dur', (1.45 + Math.random() * 1.1).toFixed(2) + 's');
          piece.style.animationDelay = (Math.random() * 0.25).toFixed(2) + 's';
          piece.addEventListener('animationend', () => piece.remove(), { once: true });
          setTimeout(() => {
            if (piece.parentNode) piece.remove();
          }, 3200);
          layer.appendChild(piece);
        }
      } catch (_) {}
    }

    /* ========================================================================
       4. GITHUB-SAFE CONFIG & VAULT MANAGER (Section 1)
       ======================================================================== */
    const ConfigVault = (function () {
      const VAULT_KEY = 'bee_vault_secrets_v1';

      function getLocalFileConfig() {
        const cfg = window.BEE_LOCAL_CONFIG;
        return cfg && typeof cfg === 'object' ? cfg : {};
      }

      function getVaultStored() {
        return SafeStorage.getJSON(VAULT_KEY, {
          geminiKey: '',
          bridgeUrl: '',
          driveFolderUrl: '',
          textModel: '',
          ttsModel: '',
          discoveredFolderId: ''
        });
      }

      function saveVaultStored(patch) {
        const next = Object.assign({}, getVaultStored(), patch || {});
        SafeStorage.setJSON(VAULT_KEY, next);
        return next;
      }

      function clearVaultStored() {
        SafeStorage.remove(VAULT_KEY);
        SafeStorage.remove('bee_working_text_model');
        SafeStorage.remove('bee_working_tts_model');
        SafeStorage.remove('bee_gemini_endpoint_mode');
      }

      function parseFolderId(urlOrId) {
        const s = String(urlOrId || '').trim();
        if (!s) return '';
        const match = s.match(/\/folders\/([A-Za-z0-9_-]+)/);
        if (match && match[1]) return match[1];
        if (/^[A-Za-z0-9_-]{20,64}$/.test(s)) return s;
        return '';
      }

      function getEffective() {
        const local = getLocalFileConfig();
        const vault = getVaultStored();

        const localKey = String(local.GEMINI_API_KEY || '').trim();
        const localBridge = String(local.DRIVE_SYNC_WEBAPP_URL || '').trim();
        const localFolderUrl = String(local.DRIVE_FOLDER_URL || '').trim();
        const localTextModel = String(local.GEMINI_TEXT_MODEL || '').trim();
        const localTtsModel = String(local.GEMINI_TTS_MODEL || '').trim();

        const geminiKey = localKey || String(vault.geminiKey || '').trim();
        const bridgeUrl = localBridge || String(vault.bridgeUrl || '').trim();
        const driveFolderUrl = localFolderUrl || String(vault.driveFolderUrl || '').trim();
        const textModelOverride = localTextModel || String(vault.textModel || '').trim();
        const ttsModelOverride = localTtsModel || String(vault.ttsModel || '').trim();

        const parsedFolderId =
          parseFolderId(driveFolderUrl) ||
          String(vault.discoveredFolderId || '').trim();

        return {
          geminiKey,
          bridgeUrl,
          driveFolderUrl,
          folderId: parsedFolderId,
          textModelOverride,
          ttsModelOverride,
          sources: {
            keyFromLocalFile: Boolean(localKey),
            bridgeFromLocalFile: Boolean(localBridge),
            folderFromLocalFile: Boolean(localFolderUrl)
          }
        };
      }

      function toBase64Url(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }

      function fromBase64Url(b64url) {
        let b64 = String(b64url || '').replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function consumeSetupHashOnBoot() {
        try {
          const hash = String(window.location.hash || '');
          const m = hash.match(/^#setup=([A-Za-z0-9_-]+)$/);
          if (!m) return false;
          const decodedUrl = fromBase64Url(m[1]).trim();
          // Strip hash immediately so URL bar stays clean
          if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }
          const parsed = new URL(decodedUrl);
          if (parsed.protocol === 'https:') {
            saveVaultStored({ bridgeUrl: parsed.toString() });
            return true;
          }
        } catch (_) {
          try {
            if (window.history && typeof window.history.replaceState === 'function') {
              window.history.replaceState(null, '', window.location.pathname + window.location.search);
            }
          } catch (_2) {}
        }
        return false;
      }

      function buildSetupLink() {
        const { bridgeUrl } = getEffective();
        if (!bridgeUrl) return '';
        try {
          const parsed = new URL(bridgeUrl);
          if (parsed.protocol !== 'https:') return '';
          const base = window.location.origin && window.location.origin !== 'null'
            ? window.location.origin + window.location.pathname
            : window.location.href.split('#')[0];
          // Security rule: NEVER include Gemini key in setup links
          return base + '#setup=' + toBase64Url(parsed.toString());
        } catch (_) {
          return '';
        }
      }

      return {
        getVaultStored,
        saveVaultStored,
        clearVaultStored,
        parseFolderId,
        getEffective,
        consumeSetupHashOnBoot,
        buildSetupLink
      };
    })();

    /* ========================================================================
       5. PROCEDURAL WEB AUDIO SOUND ENGINE & iOS UNLOCKER (Section 8 & 10.5)
       ======================================================================== */
    const SoundEngine = (function () {
      let ctx = null;
      let sfxGain = null;
      let speechGain = null;
      let clickNoiseBuf = null;
      let muted = false;
      let lastPressAt = 0;
      let lastReleaseAt = 0;
      let lastKeyTickAt = 0;
      let unlocked = false;

      const VARIANT_TUNING = {
        green:   { bodyStart: 350, bodyEnd: 148, popStart: 523.25, popEnd: 698.46, relStart: 250, relEnd: 440 },
        gold:    { bodyStart: 335, bodyEnd: 142, popStart: 493.88, popEnd: 659.25, relStart: 245, relEnd: 415 },
        amber:   { bodyStart: 325, bodyEnd: 138, popStart: 466.16, popEnd: 622.25, relStart: 240, relEnd: 400 },
        purple:  { bodyStart: 345, bodyEnd: 146, popStart: 587.33, popEnd: 783.99, relStart: 260, relEnd: 466 },
        blue:    { bodyStart: 330, bodyEnd: 140, popStart: 466.16, popEnd: 622.25, relStart: 242, relEnd: 415 },
        red:     { bodyStart: 285, bodyEnd: 118, popStart: 329.63, popEnd: 246.94, relStart: 210, relEnd: 310 },
        tab:     { bodyStart: 360, bodyEnd: 158, popStart: 493.88, popEnd: 622.25, relStart: 255, relEnd: 420 },
        chip:    { bodyStart: 370, bodyEnd: 164, popStart: 523.25, popEnd: 659.25, relStart: 260, relEnd: 430 },
        close:   { bodyStart: 310, bodyEnd: 132, popStart: 440.00, popEnd: 349.23, relStart: 220, relEnd: 330 },
        default: { bodyStart: 330, bodyEnd: 138, popStart: 440.00, popEnd: 587.33, relStart: 235, relEnd: 392 }
      };

      function ensureContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
          sfxGain = ctx.createGain();
          speechGain = ctx.createGain();
          sfxGain.gain.value = muted ? 0 : 0.86;
          speechGain.gain.value = 1.0;

          if (typeof ctx.createDynamicsCompressor === 'function') {
            const limiter = ctx.createDynamicsCompressor();
            limiter.threshold.value = -8;
            limiter.knee.value = 10;
            limiter.ratio.value = 8;
            limiter.attack.value = 0.002;
            limiter.release.value = 0.09;
            sfxGain.connect(limiter);
            limiter.connect(ctx.destination);
          } else {
            sfxGain.connect(ctx.destination);
          }
          speechGain.connect(ctx.destination);

          // Pre-compute 16ms Hann-windowed tactile switch transient buffer
          const clickLen = Math.max(64, Math.floor(ctx.sampleRate * 0.016));
          clickNoiseBuf = ctx.createBuffer(1, clickLen, ctx.sampleRate);
          const ch = clickNoiseBuf.getChannelData(0);
          for (let i = 0; i < clickLen; i++) {
            const env = Math.pow(1 - i / clickLen, 2.2);
            ch[i] = (Math.random() * 2 - 1) * env;
          }
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function setMuted(nextMuted) {
        muted = Boolean(nextMuted);
        if (sfxGain && ctx) {
          try {
            sfxGain.gain.setValueAtTime(muted ? 0 : 0.86, ctx.currentTime);
          } catch (_) {
            sfxGain.gain.value = muted ? 0 : 0.86;
          }
        }
      }

      function isMuted() {
        return muted;
      }

      function unlockFirstInteraction() {
        if (unlocked) return;
        unlocked = true;
        try {
          const c = ensureContext();
          if (c) {
            const silent = c.createBuffer(1, 1, 22050);
            const src = c.createBufferSource();
            src.buffer = silent;
            src.connect(c.destination);
            src.start(0);
          }
        } catch (_) {}

        try {
          if ('speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined') {
            window.speechSynthesis.getVoices();
            const u = new SpeechSynthesisUtterance(' ');
            u.volume = 0;
            u.rate = 2;
            window.speechSynthesis.speak(u);
          }
        } catch (_) {}
      }

      function playTone(freqStart, freqEnd, startOffset, duration, type = 'sine', peakGain = 0.22) {
        if (muted) return;
        try {
          const c = ensureContext();
          if (!c || !sfxGain) return;
          const t0 = c.currentTime + Math.max(0.003, startOffset);
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, t0);
          if (freqEnd && freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + duration);
          }
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(peakGain, t0 + Math.min(0.008, duration * 0.22));
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
          osc.connect(g);
          g.connect(sfxGain);
          osc.start(t0);
          osc.stop(t0 + duration + 0.012);
        } catch (_) {}
      }

      function playClickSnap(centerFreq = 1650, peak = 0.16) {
        if (muted) return;
        try {
          const c = ensureContext();
          if (!c || !sfxGain || !clickNoiseBuf) return;
          const t0 = c.currentTime + 0.003;
          const src = c.createBufferSource();
          src.buffer = clickNoiseBuf;
          const filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(centerFreq, t0);
          filter.frequency.exponentialRampToValueAtTime(Math.max(300, centerFreq * 0.55), t0 + 0.016);
          filter.Q.value = 2.2;
          const g = c.createGain();
          g.gain.setValueAtTime(peak, t0);
          g.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.016);
          src.connect(filter);
          filter.connect(g);
          g.connect(sfxGain);
          src.start(t0);
        } catch (_) {}
      }

      function playPress(variant = 'default') {
        if (muted) return;
        const now = performance.now();
        if (now - lastPressAt < 22) return;
        lastPressAt = now;
        const tune = VARIANT_TUNING[variant] || VARIANT_TUNING.default;
        // 1. Crisp tactile switch snap
        playClickSnap(1720, 0.16);
        // 2. Warm cushioned wooden/keycap thock body
        playTone(tune.bodyStart, tune.bodyEnd, 0.003, 0.048, 'triangle', 0.27);
        // 3. Satisfying harmonic marimba bubble pop
        playTone(tune.popStart, tune.popEnd, 0.007, 0.056, 'sine', 0.17);
      }

      function playRelease(variant = 'default') {
        if (muted) return;
        const now = performance.now();
        if (now - lastReleaseAt < 30) return;
        lastReleaseAt = now;
        const tune = VARIANT_TUNING[variant] || VARIANT_TUNING.default;
        // Soft buoyant spring-back pop when keycap lifts
        playClickSnap(1180, 0.07);
        playTone(tune.relStart, tune.relEnd, 0.003, 0.034, 'sine', 0.11);
      }

      function playKeyTick() {
        if (muted) return;
        const now = performance.now();
        if (now - lastKeyTickAt < 20) return;
        lastKeyTickAt = now;
        playClickSnap(1950, 0.11);
        playTone(390, 195, 0.003, 0.028, 'triangle', 0.14);
      }

      function playFlip() {
        if (muted) return;
        try {
          const c = ensureContext();
          if (!c || !sfxGain) return;
          const t0 = c.currentTime + 0.003;
          // Soft band-passed air whoosh
          const len = Math.floor(c.sampleRate * 0.14);
          const noiseBuf = c.createBuffer(1, len, c.sampleRate);
          const ch = noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            ch[i] = (Math.random() * 2 - 1) * Math.sin((Math.PI * i) / len);
          }
          const src = c.createBufferSource();
          src.buffer = noiseBuf;
          const filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(420, t0);
          filter.frequency.exponentialRampToValueAtTime(1250, t0 + 0.14);
          filter.Q.value = 1.8;
          const g = c.createGain();
          g.gain.setValueAtTime(0.13, t0);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
          src.connect(filter);
          filter.connect(g);
          g.connect(sfxGain);
          src.start(t0);
        } catch (_) {}
        // Soft marimba chime
        playTone(392, 587.33, 0.018, 0.11, 'sine', 0.17);
      }

      function playCorrect() {
        if (muted) return;
        // Ascending major triad chime: C5 -> E5 -> G5 -> C6
        playTone(523.25, 523.25, 0.00, 0.11, 'sine', 0.22);
        playTone(659.25, 659.25, 0.07, 0.12, 'sine', 0.24);
        playTone(783.99, 783.99, 0.14, 0.14, 'sine', 0.26);
        playTone(1046.50, 1046.50, 0.22, 0.28, 'triangle', 0.27);
      }

      function playWrong() {
        if (muted) return;
        // Gentle, low, sympathetic double-thud: F3 -> E3
        playTone(174.61, 166.0, 0.00, 0.14, 'triangle', 0.24);
        playTone(164.81, 148.0, 0.15, 0.22, 'triangle', 0.24);
      }

      function playMastery() {
        if (muted) return;
        // Celebratory fanfare arpeggio
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51, 1567.98];
        notes.forEach((n, idx) => {
          playTone(n, n, idx * 0.065, idx === notes.length - 1 ? 0.44 : 0.15, 'triangle', 0.23);
        });
      }

      function getSharedAudioObjects() {
        const c = ensureContext();
        return { ctx: c, speechGain };
      }

      return {
        unlockFirstInteraction,
        setMuted,
        isMuted,
        playPress,
        playRelease,
        playKeyTick,
        playFlip,
        playCorrect,
        playWrong,
        playMastery,
        getSharedAudioObjects
      };
    })();

    // Hook unified first-gesture audio unlocker & universal tactile button sounds
    ['pointerdown', 'touchend', 'keydown'].forEach((evtName) => {
      window.addEventListener(evtName, function onFirstGesture() {

        window.removeEventListener('pointerdown', onFirstGesture, true);
        window.removeEventListener('touchend', onFirstGesture, true);
        window.removeEventListener('keydown', onFirstGesture, true);

    });

    const INTERACTIVE_BTN_SELECTOR = 'button, .btn3d, [role="button"], [role="tab"], summary, select.select3d, a.btn3d';

    function isControlDisabled(ctrl) {
      if (!ctrl) return true;
      if (ctrl.disabled) return true;
      if (ctrl.getAttribute && ctrl.getAttribute('aria-disabled') === 'true') return true;
      return false;
    }

    function detectButtonVariant(ctrl) {
      if (!ctrl || !ctrl.classList) return 'default';
      const cl = ctrl.classList;
      if (cl.contains('btn-green')) return 'green';
      if (cl.contains('btn-gold')) return 'gold';
      if (cl.contains('btn-amber')) return 'amber';
      if (cl.contains('btn-purple')) return 'purple';
      if (cl.contains('btn-blue')) return 'blue';
      if (cl.contains('btn-red')) return 'red';
      if (cl.contains('tab-btn') || (ctrl.getAttribute && ctrl.getAttribute('role') === 'tab')) return 'tab';
      if (cl.contains('chip-toggle') || cl.contains('pos-choice-pill') || cl.contains('choice-tile')) return 'chip';
      if (cl.contains('toast-close') || (cl.contains('btn-icon') && String(ctrl.id || '').endsWith('-close'))) return 'close';
      return 'default';
    }

    let activePressedVariant = null;
    let activePressedStamp = 0;

    document.addEventListener('pointerdown', (ev) => {
      SoundEngine.unlockFirstInteraction();
      const ctrl = ev.target && ev.target.closest ? ev.target.closest(INTERACTIVE_BTN_SELECTOR) : null;

        const variant = detectButtonVariant(ctrl);
        activePressedVariant = variant;
        activePressedStamp = performance.now();
        SoundEngine.playPress(variant);
      }
    }, { capture: true, passive: true });

    document.addEventListener('pointerup', () => {
      if (activePressedVariant && (performance.now() - activePressedStamp) < 900) {

    /* ========================================================================
       6. GEMINI API CLIENT & TTS ENGINE (Section 7 — WAV/PCM + Web Speech)
       ======================================================================== */
    const GeminiClient = (function () {
      function getOrderedEndpoints() {
        const preferred = SafeStorage.get('bee_gemini_endpoint_mode');
        return preferred === 'vertex' ? ['vertex', 'aistudio'] : ['aistudio', 'vertex'];
      }

      function buildEndpointUrl(surface, model) {
        const encodedModel = encodeURIComponent(model);
        if (surface === 'vertex') {
          return `https://aiplatform.googleapis.com/v1/publishers/google/models/${encodedModel}:generateContent`;
        }
        return `https://generativelanguage.googleapis.com/v1beta/models/${encodedModel}:generateContent`;
      }

      function getTextModelChain() {
        const { textModelOverride } = ConfigVault.getEffective();
        const cached = SafeStorage.get('bee_working_text_model') || '';
        const list = [];
        if (textModelOverride) list.push(textModelOverride);
        if (cached && !list.includes(cached)) list.push(cached);
        DEFAULT_TEXT_MODELS.forEach((m) => {
          if (!list.includes(m)) list.push(m);
        });
        return list;
      }

      function getTtsModelChain() {
        const { ttsModelOverride } = ConfigVault.getEffective();
        const cached = SafeStorage.get('bee_working_tts_model') || '';
        const list = [];
        if (ttsModelOverride) list.push(ttsModelOverride);
        if (cached && !list.includes(cached)) list.push(cached);
        DEFAULT_TTS_MODELS.forEach((m) => {
          if (!list.includes(m)) list.push(m);
        });
        return list;
      }

      async function callGenerateContent({ kind = 'text', body, timeoutMs = 15000, signal }) {
        const { geminiKey } = ConfigVault.getEffective();
        if (!geminiKey) {
          throw Object.assign(new Error('No Gemini API key configured'), { code: 'no_key' });
        }
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          throw Object.assign(new Error('Offline'), { code: 'offline' });
        }

        const models = kind === 'tts' ? getTtsModelChain() : getTextModelChain();
        const surfaces = getOrderedEndpoints();
        let lastErr = null;

        for (const surface of surfaces) {
          let surfaceAuthFailed = false;

          for (const model of models) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const onOuterAbort = () => controller.abort();
            if (signal) {
              if (signal.aborted) {
                clearTimeout(timer);
                throw Object.assign(new Error('Aborted'), { code: 'aborted' });
              }
              signal.addEventListener('abort', onOuterAbort, { once: true });
            }

            try {
              const url = buildEndpointUrl(surface, model);
              const res = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': geminiKey
                },
                body: JSON.stringify(body),
                signal: controller.signal
              });

              const status = res.status;
              let json = null;
              try {
                json = await res.json();
              } catch (_) {}

              if (res.ok && json) {
                SafeStorage.set('bee_gemini_endpoint_mode', surface);
                SafeStorage.set(kind === 'tts' ? 'bee_working_tts_model' : 'bee_working_text_model', model);
                return { json, model, surface };
              }

              const errMsg = (json && json.error && json.error.message) ? String(json.error.message) : `HTTP ${status}`;

              if (status === 429) {
                if (SafeStorage.get('bee_working_tts_model') === model) {
                  SafeStorage.remove('bee_working_tts_model');
                }
                lastErr = Object.assign(new Error('Quota or rate limit reached'), { code: 'quota', status: 429 });
                continue; // Try next model in fallback chain
              }

              if (status === 401 || status === 403) {
                surfaceAuthFailed = true;
                lastErr = Object.assign(new Error(errMsg), { code: 'auth', status });
                break; // Try the other API surface (AI Studio <-> Vertex Express)
              }

              if (status === 404 || /not found|not supported|invalid model/i.test(errMsg)) {
                if (SafeStorage.get('bee_working_tts_model') === model) {
                  SafeStorage.remove('bee_working_tts_model');
                }
                lastErr = Object.assign(new Error(errMsg), { code: 'model_not_found', status });
                continue; // Try next model in fallback chain
              }

              lastErr = Object.assign(new Error(errMsg), { code: 'api_error', status });
              // If 400 on preview model, still try next fallback model once
              continue;
            } catch (err) {
              if (err && (err.name === 'AbortError' || err.code === 'aborted')) {
                if (signal && signal.aborted) {
                  throw Object.assign(new Error('Cancelled'), { code: 'aborted' });
                }
                lastErr = Object.assign(new Error('Request timed out'), { code: 'timeout' });
                break;
              }
              if (err && err.code === 'quota') {

          const fail = (err) => { if (!settled) { settled = true; reject(err); } };
          try {

      async function decodeGeminiInlineAudio(base64Data, mimeType) {
        const { ctx } = SoundEngine.getSharedAudioObjects();
        if (!ctx) throw new Error('AudioContext unavailable');

        const binary = atob(base64Data);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const isRiff =
          len > 44 &&
          bytes[0] === 0x52 && // R
          bytes[1] === 0x49 && // I
          bytes[2] === 0x46 && // F
          bytes[3] === 0x46;   // F

        if (isRiff) {
          const copyBuf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          return await decodeWavSafely(ctx, copyBuf);
        }

        // Raw 16-bit signed little-endian mono PCM
        let sampleRate = 24000;
        const rateMatch = String(mimeType || '').match(/rate=(\d+)/i);
        if (rateMatch && Number(rateMatch[1]) >= 8000) {
          sampleRate = Number(rateMatch[1]);
        }

        const sampleCount = Math.floor(bytes.byteLength / 2);
        if (sampleCount <= 0) throw new Error('Empty PCM payload');
        const audioBuffer = ctx.createBuffer(1, sampleCount, sampleRate);
        const channel = audioBuffer.getChannelData(0);
        const view = new DataView(bytes.buffer, bytes.byteOffset, sampleCount * 2);
        for (let i = 0; i < sampleCount; i++) {
          channel[i] = view.getInt16(i * 2, true) / 32768;
        }
        return audioBuffer;
      }

    const POS_ALIASES = {
      noun: 'noun', n: 'noun', 'n.': 'noun', nouns: 'noun', substantive: 'noun',
      verb: 'verb', v: 'verb', 'v.': 'verb', vb: 'verb', 'vb.': 'verb', verbs: 'verb',
      adjective: 'adjective', adj: 'adjective', 'adj.': 'adjective', a: 'adjective', adjectives: 'adjective',
      adverb: 'adverb', adv: 'adverb', 'adv.': 'adverb', adverbs: 'adverb',
      pronoun: 'pronoun', pron: 'pronoun', 'pron.': 'pronoun', pronouns: 'pronoun',
      preposition: 'preposition', prep: 'preposition', 'prep.': 'preposition', prepositions: 'preposition',
      conjunction: 'conjunction', conj: 'conjunction', 'conj.': 'conjunction', conjunctions: 'conjunction',
      interjection: 'interjection', interj: 'interjection', 'interj.': 'interjection', exclamation: 'interjection', int: 'interjection'
    };

    function normalizePosWithInference(rawPos, wordStr) {
      const cleaned = String(rawPos || '').trim().toLowerCase().replace(/^[\s(]+|[\s)]+$/g, '');
      const firstToken = cleaned.split(/[\/,;|\s]+/)[0];
      if (POS_ALIASES[cleaned]) {
        return { pos: POS_ALIASES[cleaned], inferred: false };
      }
      if (POS_ALIASES[firstToken]) {
        return { pos: POS_ALIASES[firstToken], inferred: false };
      }
      // Suffix heuristics when missing or unknown
      const w = String(wordStr || '').trim().toLowerCase();
      if (w.length > 4 && /ly$/.test(w) && !/(family|supply|apply|reply|ally|holy|belly|jelly|rally|bully)$/.test(w)) {
        return { pos: 'adverb', inferred: true };
      }
      if (/(tion|sion|ment|ness|ity|ance|ence|ship|hood|ism|ist)$/.test(w)) {
        return { pos: 'noun', inferred: true };
      }
      if (/(ous|ful|able|ible|ive|ish|less|ic|ical|ant|ent|al)$/.test(w)) {
        return { pos: 'adjective', inferred: true };
      }
      if (/(ize|ise|ate|ify|en)$/.test(w) && w.length > 4) {
        return { pos: 'verb', inferred: true };
      }
      return { pos: 'noun', inferred: true };
    }

    function inferDifficulty(wordStr) {
      const w = String(wordStr || '').trim().toLowerCase();
      let score = 0;
      if (w.length >= 9) score += 2;
      else if (w.length >= 6) score += 1;
      if (/([a-z])\1/.test(w)) score += 1; // doubled letters
      if (/(ie|ei|ough|augh|ph|rh|gh|kn|wr|ps|mn|sc|que|tion|sion|cious|tious)/.test(w)) score += 1;
      if (score >= 3) return 'hard';
      if (score >= 1) return 'medium';
      return 'easy';
    }

        [/([bcdfghlmnprstvz])\1/, '$1'], // undouble consonant
        [/([cmnprt])([aeiou])/, '$1$1$2'], // double consonant
        [/ea/, 'ee'],
        [/ee/, 'ea'],
        [/ou/, 'ow'],
        [/c([eiy])/, 's$1'],
        [/c([aou])/, 'k$1']
      ];

      for (const [rx, rep] of rules) {
        if (chosen.length >= 3) break;
        if (rx.test(w)) {
          tryAdd(w.replace(rx, rep));
        }
      }

      // Interior vowel swaps
      const vowelMap = { a: 'e', e: 'i', i: 'e', o: 'u', u: 'o', y: 'i' };
      for (let i = 1; i < w.length - 1 && chosen.length < 3; i++) {
        const ch = w[i];
        if (vowelMap[ch]) {
          tryAdd(w.slice(0, i) + vowelMap[ch] + w.slice(i + 1));
        }
      }

      // Adjacent interior transposition
      for (let i = 1; i < w.length - 1 && chosen.length < 3; i++) {
        if (w[i] !== w[i + 1]) {
          tryAdd(w.slice(0, i) + w[i + 1] + w[i] + w.slice(i + 2));
        }
      }

      // Drop an interior character
      if (w.length > 3 && chosen.length < 3) {
        const mid = Math.floor(w.length / 2);
        tryAdd(w.slice(0, mid) + w.slice(mid + 1));
      }

      // Guaranteed fallback suffixes/mutations for ultra-short words (e.g. "ox", "go")
      const fallbacks = [
        w + w[w.length - 1],
        w + 'e',
        w.slice(0, -1) + (w.endsWith('e') ? 'a' : 'e'),
        w + 's',
        w[0] + 'a' + w.slice(1),
        w[0] + 'e' + w.slice(1)
      ];
      for (const fb of fallbacks) {
        if (chosen.length >= 3) break;
        tryAdd(fb);
      }

      return chosen.slice(0, 3);
    }

    function slugWordId(wordStr) {
      const slug = String(wordStr || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 40);
      return 'w_' + (slug || Math.random().toString(36).slice(2, 9));
    }

    const VocabularyParser = (function () {
      function cleanJsonEnvelope(rawText) {
        let s = String(rawText || '').replace(/^\uFEFF/, '').trim();
        if (!s) return '';

        // Strip Markdown ```json ... ``` fences if present
        const fenceMatch = s.match(/```(?:json|javascript|js)?\s*([\s\S]*?)```/i);
        if (fenceMatch && fenceMatch[1]) {
          s = fenceMatch[1].trim();
        }

        // Normalize curly smart quotes outside normal escapes
        s = s
          .replace(/[\u201C\u201D]/g, '"')
          .replace(/[\u2018\u2019]/g, "'");

        // Extract outermost JSON array [...] or object {...}
        const firstArr = s.indexOf('[');
        const lastArr = s.lastIndexOf(']');
        const firstObj = s.indexOf('{');
        const lastObj = s.lastIndexOf('}');

        if (firstArr !== -1 && lastArr > firstArr && (firstObj === -1 || firstArr < firstObj)) {
          s = s.slice(firstArr, lastArr + 1);
        } else if (firstObj !== -1 && lastObj > firstObj) {
          s = s.slice(firstObj, lastObj + 1);
        }

        return s.trim();
      }

      function tryParseLenient(candidate) {
        if (!candidate) return null;
        try {
          return JSON.parse(candidate);
        } catch (_) {
          // Retry after removing trailing commas before ] or }
          try {
            const deComma = candidate.replace(/,\s*([\]}])/g, '$1');
            return JSON.parse(deComma);
          } catch (_2) {
            return null;
          }
        }
      }

      function normalizeItems(rawItems, existingWordsMap = null) {
        if (!Array.isArray(rawItems)) {
          return { words: [], skippedCount: 0, inferredCount: 0 };
        }

        const seenWords = new Set();
        const words = [];
        let skippedCount = 0;
        let inferredCount = 0;

        for (const row of rawItems) {
          if (!row || typeof row !== 'object') {
            skippedCount++;
            continue;
          }

          const rawWord = row.word ?? row.term ?? row.vocabulary ?? row.vocab ?? row.spelling ?? '';
          const word = String(rawWord).trim().replace(/\s+/g, ' ');
          if (!word || word.length > 80) {
            skippedCount++;
            continue;
          }

          const lowerKey = word.toLowerCase();
          if (seenWords.has(lowerKey)) {
            skippedCount++;
            continue;
          }
          seenWords.add(lowerKey);

          const rawPos = row.partOfSpeech ?? row.pos ?? row.part_of_speech ?? row.category ?? row.type ?? '';
          const posInfo = normalizePosWithInference(rawPos, word);
          if (posInfo.inferred) inferredCount++;

          const rawDiff = String(row.difficulty ?? row.level ?? '').trim().toLowerCase();
          const difficulty = DIFFICULTIES.includes(rawDiff) ? rawDiff : inferDifficulty(word);

          const rawMeaning = String(row.meaning ?? row.definition ?? row.desc ?? row.description ?? '').trim();
          const meaning = rawMeaning || `Definition for "${word}" (click Edit to customize).`;

          const rawThai = String(row.meaningThai ?? row.thai ?? row.translationThai ?? row.thaiMeaning ?? row.translate ?? '').trim();
          const meaningThai = rawThai || ThaiTranslator.getCached(word) || '';

          const rawExample = String(row.exampleSentence ?? row.example ?? row.sentence ?? row.usage ?? '').trim();
          const exampleSentence = rawExample || `Please spell the word "${word}" carefully in your notebook.`;

          const rawImg = row.image ?? row.imageUrl ?? row.image_url ?? row.img ?? row.photo ?? '';
          const image = sanitizeHttpsImageUrl(rawImg);

          const rawDistractors =
            row.distractors ??
            row.wrongSpellings ??
            row.wrong_spellings ??
            row.misspellings ??
            row.confusingSpellings ??
            [];
          const distractorsArr = typeof rawDistractors === 'string'
            ? rawDistractors.split(',').map((d) => d.trim()).filter(Boolean)
            : (Array.isArray(rawDistractors) ? rawDistractors : []);

          const distractors = buildThreeDistractors(word, distractorsArr);

          // Preserve word id when editing an existing unit so mastery progress carries over
          const preservedId = existingWordsMap && existingWordsMap.get(lowerKey);
          let id = preservedId || (typeof row.id === 'string' && /^[A-Za-z0-9_-]{2,64}$/.test(row.id) ? row.id : slugWordId(word));
          while (words.some((existing) => existing.id === id)) {
            id = slugWordId(word) + '_' + Math.random().toString(36).slice(2, 5);
          }

          words.push({
            id,
            word,
            partOfSpeech: posInfo.pos,
            posInferred: posInfo.inferred,
            meaning,
            meaningThai,
            image,
            difficulty,
            exampleSentence,
            distractors
          });
        }

        return { words, skippedCount, inferredCount };
      }

      function parseAndSanitize(rawInput, existingUnit = null) {
        const trimmed = String(rawInput || '').trim();
        if (!trimmed) {
          return { ok: false, error: 'Paste a JSON vocabulary list from Gemini or upload a .json file first.' };
        }

        const cleaned = cleanJsonEnvelope(trimmed);
        const parsed = tryParseLenient(cleaned);
        if (!parsed) {
          return {
            ok: false,
            error: 'Could not parse JSON. Make sure you copied the full [ ... ] array from Gemini without cutting off the brackets.'
          };
        }

        let list = null;
        let suggestedName = '';
        if (Array.isArray(parsed)) {
          list = parsed;
        } else if (parsed && typeof parsed === 'object') {
          if (Array.isArray(parsed.words)) list = parsed.words;
          else if (Array.isArray(parsed.vocabulary)) list = parsed.vocabulary;
          else if (Array.isArray(parsed.items)) list = parsed.items;
          if (typeof parsed.name === 'string' && parsed.name.trim()) {
            suggestedName = parsed.name.trim();
          }
        }

        if (!list) {
          return {
            ok: false,
            error: 'JSON was valid, but did not contain an array of vocabulary words.'
          };
        }

        const existingMap = new Map();
        if (existingUnit && Array.isArray(existingUnit.words)) {
          existingUnit.words.forEach((w) => {
            if (w && w.word && w.id) existingMap.set(String(w.word).trim().toLowerCase(), w.id);
          });
        }

        const norm = normalizeItems(list, existingMap);
        if (!norm.words.length) {
          return {
            ok: false,
            error: Array.isArray(list) && list.length === 0
              ? 'Gemini returned an empty list []. Copy the updated prompt in Step 1 (and switch Gemini from Flash-Lite to Flash/Pro if your worksheet has tiny print), or use Tab 2!'
              : 'No valid vocabulary words were found in the JSON input.'
          };
        }

        return {
          ok: true,
          words: norm.words,
          skippedCount: norm.skippedCount,
          inferredCount: norm.inferredCount,
          suggestedName
        };
      }

      return { parseAndSanitize, normalizeItems };
    })();

    function createResilientWordImage(wordObj, { hideWordText = false, className = '' } = {}) {
      const fallbackSrc = makeWordIllustrationDataUri(wordObj.word, wordObj.partOfSpeech, { hideWordText });
      const safeRemote = sanitizeHttpsImageUrl(wordObj.image);
      const cachedAuto = WordImageFinder.getCached(wordObj.word);
      const img = document.createElement('img');
      if (className) img.className = className;
      img.alt = hideWordText ? 'Vocabulary illustration hint' : `Illustration for ${wordObj.word}`;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';

      let autoAttempted = Boolean(safeRemote && safeRemote === cachedAuto);
      let fallbackApplied = false;

      img.addEventListener('error', () => {
        if (!autoAttempted) {
          autoAttempted = true;
          WordImageFinder.findImageUrl(wordObj.word, wordObj.meaning).then((found) => {
            if (found && img.src !== found) {
              img.src = found;
              wordObj.image = found;
            } else if (!fallbackApplied) {
              fallbackApplied = true;
              img.src = fallbackSrc;
            }
          }).catch(() => {
            if (!fallbackApplied) {
              fallbackApplied = true;
              img.src = fallbackSrc;
            }
          });
          return;
        }
        if (fallbackApplied) return;
        fallbackApplied = true;
        img.src = fallbackSrc;
      });

      if (safeRemote) {
        img.src = safeRemote;
      } else if (cachedAuto) {
        img.src = cachedAuto;
      } else {
        img.src = fallbackSrc;
        autoAttempted = true;
        WordImageFinder.findImageUrl(wordObj.word, wordObj.meaning).then((found) => {
          if (found && !fallbackApplied) {
            img.src = found;
            wordObj.image = found;
          }
        }).catch(() => {});
      }

      return img;
    }

    const preloadedImageUrls = new Set();
    function preloadWordImage(wordObj) {
      if (!wordObj) return;
      const safeRemote = sanitizeHttpsImageUrl(wordObj.image) || WordImageFinder.getCached(wordObj.word);
      if (safeRemote) {
        if (preloadedImageUrls.has(safeRemote)) return;
        preloadedImageUrls.add(safeRemote);
        try {
          const pre = new Image();
          pre.referrerPolicy = 'no-referrer';
          pre.decoding = 'async';
          pre.src = safeRemote;
        } catch (_) {}

      }
    }
