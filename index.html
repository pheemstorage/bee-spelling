<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var _beeScheme = localStorage.getItem('bee_color_scheme');
      document.querySelector('meta[name="color-scheme"]').content = _beeScheme || 'light';
    } catch (_) {}
  </script>
  <title>Bee Spelling — Tactile Vocabulary &amp; Spelling Trainer</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bee Spelling">
  <meta name="theme-color" content="#FFC800">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ========================================================================
       1. DESIGN TOKENS & COLOR SCHEME (Warm Daylight Default + Warm Night)
       ======================================================================== */
    :root {
      color-scheme: light dark;

      /* Signature Tactile Palette (Section 6) */
      --honey-gold: #FFC800;
      --honey-gold-lip: #E0AC00;
      --honey-gold-soft-light: #FFF5CC;
      --honey-gold-soft-dark: #3D3108;

      --bee-amber: #FF9600;
      --bee-amber-lip: #D97E00;
      --bee-amber-soft-light: #FFF0D6;
      --bee-amber-soft-dark: #3E2708;

      --feather-green: #58CC02;
      --feather-green-lip: #46A302;
      --feather-green-soft-light: #D7FFB8;
      --feather-green-soft-dark: #1E3B0F;

      --cardinal-red: #FF4B4B;
      --cardinal-red-lip: #D93A3A;
      --cardinal-red-soft-light: #FFDFE0;
      --cardinal-red-soft-dark: #44191B;

      --sky-blue: #1CB0F6;
      --sky-blue-lip: #1899D6;
      --sky-blue-soft-light: #DDF4FF;
      --sky-blue-soft-dark: #113549;

      --royal-purple: #CE82FF;
      --royal-purple-lip: #A560DB;
      --royal-purple-soft-light: #F5E6FF;
      --royal-purple-soft-dark: #331D45;

      /* Surface & Ink Pairs (Light = Warm Cream #FFFDF7; Dark = Warm Espresso) */
      --bg-page-light: #FFFDF7;
      --bg-page-dark: #1B1814;

      --bg-subtle-light: #F6F1E3;
      --bg-subtle-dark: #25201A;

      --card-bg-light: #FFFFFF;
      --card-bg-dark: #2B251E;

      --card-border-light: #E5E0D2;
      --card-border-dark: #433A2F;

      --card-lip-light: #E5E5E5;
      --card-lip-dark: #14110D;

      --ink-main-light: #3C3C3C;
      --ink-main-dark: #F6F0E6;

      --ink-muted-light: #756E63;
      --ink-muted-dark: #B9B0A1;

      --input-bg-light: #FBF9F2;
      --input-bg-dark: #211C16;

      /* Fallback defaults before light-dark() */
      --bg-page: var(--bg-page-light);
      --bg-subtle: var(--bg-subtle-light);
      --card-bg: var(--card-bg-light);
      --card-border: var(--card-border-light);
      --card-lip: var(--card-lip-light);
      --ink-main: var(--ink-main-light);
      --ink-muted: var(--ink-muted-light);
      --input-bg: var(--input-bg-light);
      --honey-soft: var(--honey-gold-soft-light);
      --amber-soft: var(--bee-amber-soft-light);
      --green-soft: var(--feather-green-soft-light);
      --red-soft: var(--cardinal-red-soft-light);
      --blue-soft: var(--sky-blue-soft-light);
      --purple-soft: var(--royal-purple-soft-light);
      --scrollbar-thumb: #CFC7B4;
      --scrollbar-track: #F6F1E3;

      --font-display: 'Fredoka', 'Avenir Next Rounded', 'SF Pro Rounded', ui-rounded, system-ui, -apple-system, sans-serif;
      --font-body: 'Nunito', 'Avenir Next Rounded', 'SF Pro Rounded', ui-rounded, system-ui, -apple-system, sans-serif;

      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --radius-pill: 999px;

      accent-color: var(--bee-amber);
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);

      @media (prefers-color-scheme: dark) {
        --bg-page: var(--bg-page-dark);
        --bg-subtle: var(--bg-subtle-dark);
        --card-bg: var(--card-bg-dark);
        --card-border: var(--card-border-dark);
        --card-lip: var(--card-lip-dark);
        --ink-main: var(--ink-main-dark);
        --ink-muted: var(--ink-muted-dark);
        --input-bg: var(--input-bg-dark);
        --honey-soft: var(--honey-gold-soft-dark);
        --amber-soft: var(--bee-amber-soft-dark);
        --green-soft: var(--feather-green-soft-dark);
        --red-soft: var(--cardinal-red-soft-dark);
        --blue-soft: var(--sky-blue-soft-dark);
        --purple-soft: var(--royal-purple-soft-dark);
        --scrollbar-thumb: #594E40;
        --scrollbar-track: #25201A;
      }

      &:has(> head > meta[name="color-scheme"][content="light"]) {
        color-scheme: light;
        --bg-page: var(--bg-page-light);
        --bg-subtle: var(--bg-subtle-light);
        --card-bg: var(--card-bg-light);
        --card-border: var(--card-border-light);
        --card-lip: var(--card-lip-light);
        --ink-main: var(--ink-main-light);
        --ink-muted: var(--ink-muted-light);
        --input-bg: var(--input-bg-light);
        --honey-soft: var(--honey-gold-soft-light);
        --amber-soft: var(--bee-amber-soft-light);
        --green-soft: var(--feather-green-soft-light);
        --red-soft: var(--cardinal-red-soft-light);
        --blue-soft: var(--sky-blue-soft-light);
        --purple-soft: var(--royal-purple-soft-light);
        --scrollbar-thumb: #CFC7B4;
        --scrollbar-track: #F6F1E3;
      }

      &:has(> head > meta[name="color-scheme"][content="dark"]) {
        color-scheme: dark;
        --bg-page: var(--bg-page-dark);
        --bg-subtle: var(--bg-subtle-dark);
        --card-bg: var(--card-bg-dark);
        --card-border: var(--card-border-dark);
        --card-lip: var(--card-lip-dark);
        --ink-main: var(--ink-main-dark);
        --ink-muted: var(--ink-muted-dark);
        --input-bg: var(--input-bg-dark);
        --honey-soft: var(--honey-gold-soft-dark);
        --amber-soft: var(--bee-amber-soft-dark);
        --green-soft: var(--feather-green-soft-dark);
        --red-soft: var(--cardinal-red-soft-dark);
        --blue-soft: var(--sky-blue-soft-dark);
        --purple-soft: var(--royal-purple-soft-dark);
        --scrollbar-thumb: #594E40;
        --scrollbar-track: #25201A;
      }

      @supports (color: light-dark(white, black)) {
        --bg-page: light-dark(var(--bg-page-light), var(--bg-page-dark));
        --bg-subtle: light-dark(var(--bg-subtle-light), var(--bg-subtle-dark));
        --card-bg: light-dark(var(--card-bg-light), var(--card-bg-dark));
        --card-border: light-dark(var(--card-border-light), var(--card-border-dark));
        --card-lip: light-dark(var(--card-lip-light), var(--card-lip-dark));
        --ink-main: light-dark(var(--ink-main-light), var(--ink-main-dark));
        --ink-muted: light-dark(var(--ink-muted-light), var(--ink-muted-dark));
        --input-bg: light-dark(var(--input-bg-light), var(--input-bg-dark));
        --honey-soft: light-dark(var(--honey-gold-soft-light), var(--honey-gold-soft-dark));
        --amber-soft: light-dark(var(--bee-amber-soft-light), var(--bee-amber-soft-dark));
        --green-soft: light-dark(var(--feather-green-soft-light), var(--feather-green-soft-dark));
        --red-soft: light-dark(var(--cardinal-red-soft-light), var(--cardinal-red-soft-dark));
        --blue-soft: light-dark(var(--sky-blue-soft-light), var(--sky-blue-soft-dark));
        --purple-soft: light-dark(var(--royal-purple-soft-light), var(--royal-purple-soft-dark));
        --scrollbar-thumb: light-dark(#CFC7B4, #594E40);
        --scrollbar-track: light-dark(#F6F1E3, #25201A);
      }
    }

    @supports not (scrollbar-color: auto) {
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 99px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    }

    /* ========================================================================
       2. RESET, BASE TYPOGRAPHY & CROSS-PLATFORM VIEWPORT RULES
       ======================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
      /* Subtle tactile honeycomb dot pattern — daylight crisp, zero blur blobs */
      background-image: radial-gradient(var(--card-border) 1.25px, transparent 1.25px);
      background-size: 26px 26px;
      color: var(--ink-main);
      font-family: var(--font-body);
      font-weight: 700;
      line-height: 1.45;
      overflow-x: clip;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
      text-wrap: balance;
      letter-spacing: -0.01em;
    }

    p { margin: 0; }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    /* Prevent iOS Safari input auto-zoom: ALWAYS >= 16px */
    input, textarea, select {
      font-size: max(16px, 1rem);
    }

    button, [role="button"], summary, label {
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 3px solid var(--sky-blue);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ========================================================================
       3. TACTILE 3D CONTROLS, CARDS, BADGES & INPUTS
       ======================================================================== */
    .card3d {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-bottom: 4px solid var(--card-lip);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      min-width: 0;
    }

    
    /* 3D Animated Vector Icon Utilities */
    .icon3d {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn3d:hover .icon3d,
    .btn3d:focus-visible .icon3d {
      transform: translateY(-1.5px) scale(1.09);
    }
    .btn3d:active .icon3d {
      transform: translateY(2px) scale(0.94);
    }

    @media (prefers-reduced-motion: no-preference) {
      .icon-float-3d {
        animation: iconBob3d 2.6s ease-in-out infinite;
      }
      .i3d-bob {
        animation: iconBob3d 2.1s ease-in-out infinite;
      }
      .i3d-sparkle {
        transform-origin: center;
        transform-box: fill-box;
        animation: iconTwinkle3d 2.2s ease-in-out infinite;
      }
      .i3d-wave {
        animation: iconWavePulse 1.7s ease-in-out infinite;
      }
    }

    @keyframes iconBob3d {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes iconTwinkle3d {
      0%, 100% { transform: scale(0.86) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.18) rotate(14deg); opacity: 1; }
    }

    @keyframes iconWavePulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    /* Animated 3D Settings Gear Icon */
    .icon-gear-animated {
      transform-origin: 12px 12px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hud-settings-btn:hover .icon-gear-animated,
    .hud-settings-btn:focus-visible .icon-gear-animated {
      transform: rotate(45deg);
    }
    .hud-settings-btn:active .icon-gear-animated {
      transform: rotate(90deg) scale(0.92);
    }

    /* Unified Settings Menu Dialog / Sheet styling */
    .settings-sheet[open] {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: auto 0 0 0;
      margin: 0 auto;
      width: min(100dvw, 560px);
      max-height: 88dvh;
      padding: 0;
      background: var(--card-bg);
      color: var(--ink-main);
      border: 2.5px solid var(--card-border);
      border-bottom: 0;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      overflow: hidden;
    }
    @media (min-width: 720px) {
      .settings-sheet[open] {
        position: fixed;
        inset: auto 1.5rem 1.5rem auto;
        margin: 0;
        width: 440px;
        max-height: min(85dvh, 760px);
        border-radius: var(--radius-xl);
        border: 2.5px solid var(--card-border);
        border-bottom: 6px solid var(--card-lip);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.22);
      }
    }

    .btn3d {
      --btn-bg: var(--card-bg);
      --btn-fg: var(--ink-main);
      --btn-border: var(--card-border);
      --btn-lip: var(--card-lip);

      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.68rem 1.15rem;
      min-height: 44px;
      min-width: 0;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 2px solid var(--btn-border);
      border-bottom: 4px solid var(--btn-lip);
      margin-bottom: 0;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.15;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition:
        transform 0.16s var(--spring-bounce),
        border-bottom-width 0.08s ease,
        margin-bottom 0.08s ease,
        filter 0.14s ease,
        background-color 0.14s ease;
    }

    .btn3d:hover:not(:disabled) {
      filter: brightness(1.03);
    }

    /* Depresses physical 4px bottom lip with zero sibling layout shift */
    .btn3d:active:not(:disabled),
    .btn3d.is-pressed:not(:disabled) {
      transform: translateY(4px);
      border-bottom-width: 0px;
      margin-bottom: 4px;
    }

    .btn3d:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: saturate(0.45);
    }

    .btn3d svg {
      pointer-events: none;
    }

    /* Color Variants */
    .btn-gold {
      --btn-bg: var(--honey-gold);
      --btn-fg: #3A2A00;
      --btn-border: var(--honey-gold-lip);
      --btn-lip: var(--honey-gold-lip);
    }
    .btn-amber {
      --btn-bg: var(--bee-amber);
      --btn-fg: #FFFFFF;
      --btn-border: var(--bee-amber-lip);
      --btn-lip: var(--bee-amber-lip);
    }
    .btn-green {
      --btn-bg: var(--feather-green);
      --btn-fg: #FFFFFF;
      --btn-border: var(--feather-green-lip);
      --btn-lip: var(--feather-green-lip);
    }
    .btn-red {
      --btn-bg: var(--cardinal-red);
      --btn-fg: #FFFFFF;
      --btn-border: var(--cardinal-red-lip);
      --btn-lip: var(--cardinal-red-lip);
    }
    .btn-blue {
      --btn-bg: var(--sky-blue);
      --btn-fg: #FFFFFF;
      --btn-border: var(--sky-blue-lip);
      --btn-lip: var(--sky-blue-lip);
    }
    .btn-purple {
      --btn-bg: var(--royal-purple);
      --btn-fg: #FFFFFF;
      --btn-border: var(--royal-purple-lip);
      --btn-lip: var(--royal-purple-lip);
    }
    .btn-sm {
      padding: 0.45rem 0.8rem;
      min-height: 38px;
      font-size: 0.88rem;
      border-radius: var(--radius-sm);
    }
    .btn-lg {
      padding: 0.9rem 1.5rem;
      min-height: 54px;
      font-size: 1.12rem;
      border-radius: var(--radius-lg);
    }
    .btn-icon {
      padding: 0.42rem;
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .btn-block {
      width: 100%;
    }

    /* Styled Form Controls (Anti-AI rule: zero default browser inputs) */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
      min-width: 0;
    }

    .field-label {
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .input3d, .textarea3d, .select3d {
      appearance: none;
      width: 100%;
      min-width: 0;
      padding: 0.72rem 0.95rem;
      background: var(--input-bg);
      color: var(--ink-main);
      border: 2px solid var(--card-border);
      border-bottom: 4px solid var(--card-lip);
      border-radius: var(--radius-md);
      font-weight: 700;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .input3d:focus, .textarea3d:focus, .select3d:focus {
      outline: none;
      border-color: var(--sky-blue);
      border-bottom-color: var(--sky-blue-lip);
      background: var(--card-bg);
    }

    .select3d {
      padding-right: 2.35rem;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%),
        linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 52%,
        calc(100% - 12px) 52%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      cursor: pointer;
    }

    .textarea3d {
      min-height: 130px;
      resize: vertical;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: max(16px, 0.95rem);
      line-height: 1.4;
    }

    .input-with-btn {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }
    .input-with-btn .input3d {
      flex: 1;
    }

    /* Badges & POS Pills */
    .pos-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.28rem 0.78rem;
      background: var(--royal-purple);
      color: #FFFFFF;
      border: 2px solid var(--royal-purple-lip);
      border-bottom: 3px solid var(--royal-purple-lip);
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 0.84rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .pos-chip-mini {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.18rem 0.55rem;
      background: var(--purple-soft);
      color: var(--ink-main);
      border: 1.5px solid var(--royal-purple-lip);
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: capitalize;
    }

    .pill-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      padding: 0.35rem 0.7rem;
      background: var(--bg-subtle);
      border: 2px solid var(--card-border);
      border-bottom: 3px solid var(--card-lip);
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Progress Bars */
    .progress-track {
      width: 100%;
      height: 14px;
      background: var(--bg-subtle);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-pill);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--feather-green);
      border-radius: var(--radius-pill);
      position: relative;
      transition: width 0.45s var(--spring-bounce);
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      inset: 2px 6px auto 6px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.42);
    }

    .progress-fill.gold {
      background: var(--honey-gold);
    }

    /* ========================================================================
       4. STICKY GAMIFIED HUD (Section 6 — Zero Horizontal Overflow)
       ======================================================================== */
    .app-hud {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--card-bg);
      border-bottom: 3px solid var(--card-border);
      padding-top: max(0.5rem, env(safe-area-inset-top));
      padding-bottom: 0.5rem;
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }

    .hud-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
      min-width: 0;
    }

    .hud-left, .hud-center, .hud-right {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }

    .hud-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.38rem 0.72rem;
      font-size: 1.02rem;
      flex-shrink: 0;
    }

    .hud-brand-text {
      font-family: var(--font-display);
      font-weight: 700;
    }

    .hud-unit-btn {
      max-width: 200px;
      overflow: hidden;
    }

    .hud-unit-btn span.truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hud-mastery-box {
      display: flex;
      align-items: center;
      gap: 0.42rem;
      min-width: 108px;
      max-width: 150px;
    }

    .hud-mastery-box .progress-track {
      height: 11px;
      flex: 1;
    }

    .hud-mastery-pct {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--ink-muted);
      min-width: 32px;
    }

    /* Cloud Sync Status States */
    .sync-pill[data-sync-state="synced"] {
      --btn-bg: var(--green-soft);
      --btn-border: var(--feather-green);
      --btn-lip: var(--feather-green-lip);
    }
    .sync-pill[data-sync-state="syncing"] {
      --btn-bg: var(--blue-soft);
      --btn-border: var(--sky-blue);
      --btn-lip: var(--sky-blue-lip);
    }
    .sync-pill[data-sync-state="setup"] {
      --btn-bg: var(--honey-soft);
      --btn-border: var(--honey-gold-lip);
      --btn-lip: var(--honey-gold-lip);
    }
    .sync-pill[data-sync-state="error"] {
      --btn-bg: var(--red-soft);
      --btn-border: var(--cardinal-red);
      --btn-lip: var(--cardinal-red-lip);
    }
    .sync-pill[data-sync-state="syncing"] .icon-cloud-3d {
      animation: beeFloat 1.1s ease-in-out infinite;
    }

    .streak-flame {
      display: inline-block;
      @media (prefers-reduced-motion: no-preference) {
        animation: flamePulse 2.2s ease-in-out infinite;
      }
    }

    @keyframes flamePulse {
      0%, 100% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.13) rotate(3deg); }
    }

    .hud-more-btn {
      display: none;
    }

    @media (max-width: 980px) {
      .hud-mastery-box,
      .hud-desktop-only {
        display: none !important;
      }
      .hud-more-btn {
        display: inline-flex;
      }
    }

    @media (max-width: 560px) {
      .hud-brand-text,
      .sync-label-text {
        display: none;
      }
      .hud-unit-btn {
        max-width: 118px;
        padding-inline: 0.55rem;
      }
      .pill-stat {
        padding: 0.3rem 0.52rem;
        font-size: 0.8rem;
      }
    }

    /* ========================================================================
       5. MAIN STAGE, SCREENS & RESPONSIVE LAYOUTS
       ======================================================================== */
    .app-main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding-top: 1.25rem;
      padding-bottom: max(1.75rem, calc(env(safe-area-inset-bottom) + 1rem));
      padding-left: max(0.9rem, env(safe-area-inset-left));
      padding-right: max(0.9rem, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .screen-title {
      font-size: clamp(1.4rem, 1.1rem + 1.5vw, 2.05rem);
      overflow-wrap: anywhere;
    }

    .subtitle-muted {
      color: var(--ink-muted);
      font-size: 0.96rem;
    }

    /* Login Card */
    .auth-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 0.75rem;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: clamp(1.25rem, 3vw, 2rem);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .auth-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.55rem;
    }

    .banner-msg {
      padding: 0.75rem 0.95rem;
      border-radius: var(--radius-md);
      border: 2px solid var(--card-border);
      font-size: 0.92rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .banner-error {
      background: var(--red-soft);
      border-color: var(--cardinal-red);
      color: var(--ink-main);
    }
    .banner-info {
      background: var(--blue-soft);
      border-color: var(--sky-blue);
      color: var(--ink-main);
    }
    .banner-warn {
      background: var(--honey-soft);
      border-color: var(--honey-gold-lip);
      color: var(--ink-main);
    }
    .banner-success {
      background: var(--green-soft);
      border-color: var(--feather-green);
      color: var(--ink-main);
    }

    /* Units Hub Grid */
    .hub-cta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      margin-bottom: 1.35rem;
      background: var(--honey-soft);
      border: 2px solid var(--honey-gold-lip);
      border-bottom: 4px solid var(--honey-gold-lip);
      border-radius: var(--radius-xl);
      padding: 1.15rem 1.35rem;
    }

    .hub-cta-info {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-width: 0;
      flex: 1 1 260px;
    }

    .hub-cta-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .units-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
      gap: 1.1rem;
    }

    .unit-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.95rem;
      transition: transform 0.16s var(--spring-bounce);
    }

    .unit-card-top {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-width: 0;
    }

    .unit-card-title {
      font-size: 1.24rem;
      overflow-wrap: anywhere;
    }

    .pos-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .recovery-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.38rem;
      font-size: 0.82rem;
    }

    .recovery-pill {
      padding: 0.2rem 0.58rem;
      border-radius: var(--radius-pill);
      background: var(--amber-soft);
      border: 1.5px solid var(--bee-amber-lip);
      font-weight: 800;
    }

    .unit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding-top: 0.35rem;
      border-top: 2px dashed var(--card-border);
    }

    .unit-actions .btn-start {
      flex: 1 1 100%;
    }

    .unit-actions .btn-sub {
      flex: 1 1 auto;
    }

    /* Unit Home Mode Picker */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
      gap: 1.15rem;
      margin-top: 1rem;
    }

    .mode-card {
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.9rem;
      padding: 1.45rem;
      border-radius: var(--radius-xl);
      cursor: pointer;
    }

    .mode-icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--honey-soft);
      border: 2px solid var(--honey-gold-lip);
      border-bottom: 4px solid var(--honey-gold-lip);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55);
      transition: transform 0.28s var(--spring-bounce);
    }

    .mode-card:hover .mode-icon-badge,
    .card3d:hover .mode-icon-badge {
      transform: translateY(-2px) scale(1.05) rotate(-2deg);
    }

    /* ========================================================================
       6. MODE 1: MEMORIES 3D FLASHCARD & 5-WORD MINI-QUIZ
       ======================================================================== */
    .memories-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .flashcard-scene {
      width: 100%;
      perspective: 1000px;
      -webkit-perspective: 1000px;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      min-height: 410px;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.55s var(--spring-bounce);
      @media (prefers-reduced-motion: reduce) {
        transition: transform 0.18s ease-out;
      }
    }

    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      width: 100%;
      min-height: 410px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-bottom: 6px solid var(--card-lip);
      border-radius: var(--radius-xl);
      padding: clamp(1rem, 3vw, 1.65rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 0.95rem;
      text-align: center;
    }

    .flashcard-front {
      position: relative;
      pointer-events: auto;
    }

    .flashcard-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      pointer-events: none;
      overflow-y: auto;
    }

    .flashcard-inner.is-flipped .flashcard-front {
      pointer-events: none;
    }

    .flashcard-inner.is-flipped .flashcard-back {
      pointer-events: auto;
    }

    .word-img-frame {
      width: 100%;
      max-width: 310px;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-lg);
      border: 3px solid var(--card-border);
      border-bottom: 5px solid var(--card-lip);
      overflow: hidden;
      background: var(--bg-subtle);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .word-img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .word-display-lg {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 1.25rem + 2.8vw, 2.65rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      overflow-wrap: anywhere;
    }

    .thai-translation-front {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      background: var(--honey-soft);
      border: 2px solid var(--honey-gold-lip);
      color: var(--honey-dark);
      font-weight: 700;
      font-size: 1.05rem;
      max-width: 95%;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 0 var(--honey-gold-lip);
    }

    .thai-flag-badge {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--honey-gold);
      color: #ffffff;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      letter-spacing: 0.5px;
      line-height: 1;
      flex-shrink: 0;
    }

    .thai-translation-back {
      background: var(--honey-soft);
      border: 2px solid var(--honey-gold-lip);
      border-bottom: 4px solid var(--honey-gold-lip);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .thai-back-content {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--honey-dark);
      overflow-wrap: anywhere;
    }

    .meaning-box {
      background: var(--bg-subtle);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 0.95rem 1.1rem;
      width: 100%;
      font-size: 1.05rem;
      overflow-wrap: anywhere;
    }

    .example-box {
      background: var(--honey-soft);
      border: 2px solid var(--honey-gold-lip);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      width: 100%;
      font-style: italic;
      font-size: 0.98rem;
      overflow-wrap: anywhere;
    }

    .memories-nav-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.65rem;
    }

    /* ========================================================================
       7. QUIZ & MINI-QUIZ INTERACTIVE STAGE (Tablet Landscape Split Ready)
       ======================================================================== */
    .quiz-stage {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.15rem;
      align-items: start;
      width: 100%;
    }

    @media (min-width: 860px) {
      .quiz-stage.split-capable {
        grid-template-columns: minmax(280px, 5fr) minmax(340px, 7fr);
      }
    }

    .quiz-prompt-card,
    .quiz-answer-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
      gap: 0.7rem;
    }

    .choice-tile {
      justify-content: flex-start;
      text-align: left;
      padding: 0.85rem 1rem;
      font-size: 1.05rem;
      overflow-wrap: anywhere;
    }

    .choice-tile[aria-pressed="true"],
    .choice-tile.is-selected {
      --btn-bg: var(--blue-soft);
      --btn-border: var(--sky-blue);
      --btn-lip: var(--sky-blue-lip);
    }

    .choice-tile.is-correct {
      --btn-bg: var(--green-soft);
      --btn-border: var(--feather-green);
      --btn-lip: var(--feather-green-lip);
    }

    .choice-tile.is-wrong {
      --btn-bg: var(--red-soft);
      --btn-border: var(--cardinal-red);
      --btn-lip: var(--cardinal-red-lip);
    }

    .kbd-hint {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 24px;
      padding-inline: 5px;
      border-radius: 7px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--card-border);
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    @media (hover: none) and (pointer: coarse) {
      .kbd-hint { display: none; }
    }

    /* POS 4-Pill Selector (Required on EVERY Quiz & Mini-Quiz Question) */
    .pos-picker-section {
      background: var(--bg-subtle);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .pos-pills-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }

    @media (min-width: 520px) {
      .pos-pills-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .pos-choice-pill {
      --btn-bg: var(--card-bg);
      --btn-fg: var(--ink-main);
      --btn-border: var(--royal-purple-lip);
      --btn-lip: var(--royal-purple-lip);
      text-transform: capitalize;
      padding: 0.58rem 0.5rem;
      font-size: 0.92rem;
    }

    .pos-choice-pill[aria-pressed="true"],
    .pos-choice-pill.is-selected {
      --btn-bg: var(--royal-purple);
      --btn-fg: #FFFFFF;
      --btn-border: var(--royal-purple-lip);
      --btn-lip: #7B3DB3;
    }

    .pos-choice-pill.is-correct {
      --btn-bg: var(--feather-green);
      --btn-fg: #FFFFFF;
      --btn-border: var(--feather-green-lip);
      --btn-lip: var(--feather-green-lip);
    }

    .pos-choice-pill.is-wrong {
      --btn-bg: var(--cardinal-red);
      --btn-fg: #FFFFFF;
      --btn-border: var(--cardinal-red-lip);
      --btn-lip: var(--cardinal-red-lip);
    }

    /* Fill-in-the-Gaps Letter Tiles & Inputs */
    .gaps-word-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      padding: 0.65rem 0.35rem;
    }

    .gap-static-tile {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      height: 48px;
      padding-inline: 0.4rem;
      background: var(--bg-subtle);
      border: 2px solid var(--card-border);
      border-bottom: 4px solid var(--card-lip);
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      text-transform: lowercase;
    }

    .gap-char-input {
      width: 44px;
      height: 50px;
      padding: 0;
      text-align: center;
      background: var(--honey-soft);
      color: var(--ink-main);
      border: 2.5px solid var(--bee-amber);
      border-bottom: 5px solid var(--bee-amber-lip);
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: max(18px, 1.35rem);
      font-weight: 700;
      text-transform: lowercase;
    }

    .gap-char-input:focus {
      outline: none;
      background: var(--card-bg);
      border-color: var(--sky-blue);
      border-bottom-color: var(--sky-blue-lip);
      transform: translateY(-2px);
    }

    .gap-char-input.is-correct {
      background: var(--green-soft);
      border-color: var(--feather-green);
      border-bottom-color: var(--feather-green-lip);
    }

    .gap-char-input.is-wrong {
      background: var(--red-soft);
      border-color: var(--cardinal-red);
      border-bottom-color: var(--cardinal-red-lip);
    }

    .bee-spell-input {
      text-align: center;
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 1rem + 1.2vw, 1.65rem);
      letter-spacing: 0.04em;
      padding: 0.85rem 1rem;
    }

    /* Sticky Action Footer inside Quiz/Mini-Quiz */
    .quiz-action-bar {
      position: sticky;
      bottom: 0;
      z-index: 20;
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-bottom: 4px solid var(--card-lip);
      border-radius: var(--radius-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .quiz-action-bar.state-correct {
      background: var(--green-soft);
      border-color: var(--feather-green);
      border-bottom-color: var(--feather-green-lip);
    }

    .quiz-action-bar.state-wrong {
      background: var(--red-soft);
      border-color: var(--cardinal-red);
      border-bottom-color: var(--cardinal-red-lip);
    }

    /* Filter Chips */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.48rem;
    }

    .chip-toggle {
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
    }

    .chip-toggle[aria-pressed="true"] {
      --btn-bg: var(--sky-blue);
      --btn-fg: #FFFFFF;
      --btn-border: var(--sky-blue-lip);
      --btn-lip: var(--sky-blue-lip);
    }

    /* ========================================================================
       8. 3D ANIMATED BEE MASCOT ("BUZZY") & CONFETTI
       ======================================================================== */
    .mascot-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      flex-shrink: 0;
    }

    .mascot-svg {
      display: block;
      overflow: visible;
    }

    .mascot-body-group {
      transform-origin: 60px 62px;
      @media (prefers-reduced-motion: no-preference) {
        animation: beeFloat 2.8s ease-in-out infinite;
      }
    }

    .mascot-wing-l {
      transform-origin: 48px 46px;
      @media (prefers-reduced-motion: no-preference) {
        animation: wingFlutterL 0.22s ease-in-out infinite alternate;
      }
    }

    .mascot-wing-r {
      transform-origin: 72px 46px;
      @media (prefers-reduced-motion: no-preference) {
        animation: wingFlutterR 0.22s ease-in-out infinite alternate;
      }
    }

    .mascot-shadow {
      transform-origin: 60px 110px;
      @media (prefers-reduced-motion: no-preference) {
        animation: beeShadow 2.8s ease-in-out infinite;
      }
    }

    /* Expressive Mascot States */
    .mascot-wrap[data-state="happy"] .mascot-body-group,
    .mascot-wrap[data-state="celebrate"] .mascot-body-group {
      @media (prefers-reduced-motion: no-preference) {
        animation: beeHappyBounce 0.62s var(--spring-bounce) infinite alternate;
      }
    }

    .mascot-wrap[data-state="thinking"] .mascot-body-group {
      transform: rotate(-9deg) translateY(-2px);
      animation: none;
    }

    .mascot-wrap[data-state="listening"] .mascot-body-group {
      transform: rotate(9deg) translateX(5px) scale(1.06);
      @media (prefers-reduced-motion: no-preference) {
        animation: beeListenPulse 1.1s ease-in-out infinite;
      }
    }

    .mascot-wrap[data-state="wrong"] .mascot-body-group {
      @media (prefers-reduced-motion: no-preference) {
        animation: beeSympathyBuzz 0.48s ease-in-out 1;
      }
    }

    @keyframes beeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes beeShadow {
      0%, 100% { transform: scaleX(1); opacity: 0.22; }
      50% { transform: scaleX(0.84); opacity: 0.14; }
    }
    @keyframes wingFlutterL {
      0% { transform: rotate(-8deg) scaleY(1); }
      100% { transform: rotate(16deg) scaleY(0.88); }
    }
    @keyframes wingFlutterR {
      0% { transform: rotate(8deg) scaleY(1); }
      100% { transform: rotate(-16deg) scaleY(0.88); }
    }
    @keyframes beeHappyBounce {
      0% { transform: translateY(2px) scale(0.97, 1.03); }
      100% { transform: translateY(-12px) scale(1.04, 0.97) rotate(4deg); }
    }
    @keyframes beeListenPulse {
      0%, 100% { transform: rotate(8deg) translateX(4px) scale(1.05); }
      50% { transform: rotate(12deg) translateX(7px) scale(1.09); }
    }
    @keyframes beeSympathyBuzz {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-5px) rotate(-6deg); }
      45% { transform: translateX(5px) rotate(5deg); }
      70% { transform: translateX(-3px) rotate(-3deg); }
    }

    /* Confetti Overlay */
    #confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    .confetti-piece {
      position: absolute;
      top: -18px;
      width: 11px;
      height: 16px;
      border-radius: 3px;
      pointer-events: none;
      @media (prefers-reduced-motion: no-preference) {
        animation: confettiFall var(--fall-dur, 1.9s) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }
    }

    @keyframes confettiFall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 1;
      }
      85% { opacity: 1; }
      100% {
        transform: translate3d(var(--drift-x, 40px), 102dvh, 0) rotate(var(--spin-deg, 540deg));
        opacity: 0;
      }
    }

    /* ========================================================================
       9. NATIVE <dialog> MODALS, SLIDE-IN DRAWER, POPOVER & TOASTS
       ======================================================================== */
    dialog:modal {
      overscroll-behavior: contain;
    }

    dialog::backdrop {
      background: rgba(24, 20, 14, 0.52);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    /* Scope display ONLY to dialog[open] so closed dialogs never stay visible */
    dialog.modal-box[open] {
      display: flex;
      flex-direction: column;
      width: min(94dvw, 760px);
      max-height: min(90dvh, 840px);
      margin: auto;
      padding: 0;
      background: var(--card-bg);
      color: var(--ink-main);
      border: 2.5px solid var(--card-border);
      border-bottom: 6px solid var(--card-lip);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    dialog.modal-sm[open] {
      width: min(92dvw, 480px);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-bottom: 2px solid var(--card-border);
      background: var(--bg-subtle);
      flex-shrink: 0;
    }

    .modal-body {
      padding: 1.2rem 1.25rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
      min-height: 0;
    }

    .modal-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
      padding: 0.9rem 1.25rem;
      padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
      border-top: 2px solid var(--card-border);
      background: var(--bg-subtle);
      flex-shrink: 0;
    }

    /* Slide-In Right Drawer (AI Coach & Progress) */
    dialog.drawer-right[open] {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 0 0 auto;
      margin: 0;
      width: min(92dvw, 470px);
      height: 100dvh;
      max-height: 100dvh;
      padding: 0;
      background: var(--card-bg);
      color: var(--ink-main);
      border: 0;
      border-left: 3px solid var(--card-border);
      border-radius: var(--radius-xl) 0 0 var(--radius-xl);
      overflow: hidden;
      @media (prefers-reduced-motion: no-preference) {
        animation: slideInRight 0.26s var(--spring-bounce);
      }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Bottom Sheet on Mobile ("More" Menu) */
    dialog.bottom-sheet[open] {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: auto 0 0 0;
      margin: 0 auto;
      width: min(100dvw, 540px);
      max-height: 86dvh;
      padding: 0;
      background: var(--card-bg);
      color: var(--ink-main);
      border: 2.5px solid var(--card-border);
      border-bottom: 0;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      overflow: hidden;
      @media (prefers-reduced-motion: no-preference) {
        animation: slideUpSheet 0.24s var(--spring-bounce);
      }
    }

    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Sync Status Popover */
    #sync-popover {
      margin: 0;
      inset: auto;
      position: fixed;
      top: calc(max(0.5rem, env(safe-area-inset-top)) + 56px);
      right: max(0.75rem, env(safe-area-inset-right));
      width: min(92dvw, 320px);
      padding: 1rem;
      background: var(--card-bg);
      color: var(--ink-main);
      border: 2px solid var(--card-border);
      border-bottom: 5px solid var(--card-lip);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
      z-index: 80;
    }

    [popover]:is(:popover-open, .\:popover-open) {
      display: block;
    }

    /* Top-Layer Persistent Toasts */
    .toast-item {
      margin: 0;
      inset: auto;
      position: fixed;
      left: 50%;
      bottom: calc(max(1rem, env(safe-area-inset-bottom)) + var(--toast-offset, 0px));
      transform: translateX(-50%);
      width: max-content;
      max-width: min(92dvw, 440px);
      padding: 0.68rem 1rem;
      background: var(--ink-main);
      color: var(--bg-page);
      border: 2px solid var(--honey-gold);
      border-bottom: 4px solid var(--honey-gold-lip);
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 0.93rem;
      font-weight: 600;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
      z-index: 9500;
      display: none;
      align-items: center;
      gap: 0.6rem;
      transition: bottom 0.2s ease, opacity 0.2s ease;
    }

    .toast-item:is(:popover-open, .\:popover-open, .is-open-fallback) {
      display: inline-flex;
    }

    .toast-close {
      appearance: none;
      background: transparent;
      border: 0;
      color: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0 0.2rem;
      opacity: 0.8;
    }

    /* ========================================================================
       10. TABS, DROPZONE & CONTAINER-QUERY RESPONSIVE WORD EDITOR TABLE
       ======================================================================== */
    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.35rem;
      background: var(--bg-subtle);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-md);
    }

    .tab-btn {
      flex: 1 1 auto;
      padding: 0.52rem 0.85rem;
      font-size: 0.9rem;
    }

    .tab-btn[aria-selected="true"] {
      --btn-bg: var(--honey-gold);
      --btn-fg: #3A2A00;
      --btn-border: var(--honey-gold-lip);
      --btn-lip: var(--honey-gold-lip);
    }

    .dropzone {
      border: 2.5px dashed var(--bee-amber);
      border-radius: var(--radius-lg);
      background: var(--honey-soft);
      padding: 1rem;
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .dropzone.is-dragover {
      background: var(--blue-soft);
      border-color: var(--sky-blue);
      transform: scale(1.01);
    }

    /* Responsive Table with @container Stacked Mobile Cards */
    .table-wrapper {
      overflow: auto;
      max-inline-size: 100%;
      max-block-size: min(420px, 56dvh);
      container-type: inline-size;
      border: 2px solid var(--card-border);
      border-radius: var(--radius-md);
      background: var(--card-bg);
    }

    .word-editor-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      --label-pos: "Part of Speech";
      --label-diff: "Difficulty";
      --label-meaning: "Meaning & Example";
      --label-dist: "Distractors";
      --label-img: "Image";
      --label-act: "Action";
    }

    .word-editor-table thead {
      position: sticky;
      inset-block-start: 0;
      z-index: 2;
      background: var(--bg-subtle);
    }

    .word-editor-table th,
    .word-editor-table td {
      padding: 0.6rem 0.65rem;
      border-bottom: 1.5px solid var(--card-border);
      vertical-align: top;
      text-align: left;
      font-size: 0.88rem;
    }

    .word-editor-table tbody th {
      position: sticky;
      inset-inline-start: 0;
      z-index: 1;
      background: var(--card-bg);
      min-width: 135px;
    }

    .mini-thumb {
      width: 58px;
      height: 44px;
      border-radius: 8px;
      border: 1.5px solid var(--card-border);
      object-fit: cover;
      display: block;
      background: var(--bg-subtle);
    }

    @container (width < 640px) {
      .word-editor-table,
      .word-editor-table thead,
      .word-editor-table tbody,
      .word-editor-table tr,
      .word-editor-table th,
      .word-editor-table td {
        display: block;
      }

      .word-editor-table thead {
        display: none;
      }

      .word-editor-table tr {
        margin: 0.65rem;
        border: 2px solid var(--card-border);
        border-bottom: 4px solid var(--card-lip);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .word-editor-table tbody th {
        position: sticky;
        inset-block-start: 0;
        z-index: 2;
        background: var(--honey-soft);
      }

      .word-editor-table td::before {
        display: block;
        font-family: var(--font-display);
        font-size: 0.78rem;
        color: var(--ink-muted);
        margin-bottom: 0.25rem;
      }

      .word-editor-table td:nth-child(2)::before { content: var(--label-pos) ": "; }
      .word-editor-table td:nth-child(3)::before { content: var(--label-diff) ": "; }
      .word-editor-table td:nth-child(4)::before { content: var(--label-meaning) ": "; }
      .word-editor-table td:nth-child(5)::before { content: var(--label-dist) ": "; }
      .word-editor-table td:nth-child(6)::before { content: var(--label-img) ": "; }
      .word-editor-table td:nth-child(7)::before { content: var(--label-act) ": "; }
    }

    /* Recovery 3-Strike Dots */
    .strike-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .strike-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid var(--bee-amber-lip);
      background: transparent;
    }

    .strike-dot.filled {
      background: var(--feather-green);
      border-color: var(--feather-green-lip);
    }

    /* Utility Flex/Grid Helpers */
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .row-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stack-sm { display: flex; flex-direction: column; gap: 0.5rem; }
    .stack-md { display: flex; flex-direction: column; gap: 0.9rem; }
  </style>
</head>
<body>
  <!-- ======================================================================
       STICKY TOP GAMIFIED HUD
       ====================================================================== -->
  <header id="app-hud" class="app-hud">
    <div class="hud-inner">
      <div class="hud-left">

          <svg class="icon3d icon-float-3d" viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
            <defs>
              <linearGradient id="brandBeeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFF066"/>

              </linearGradient>
            </defs>
            <ellipse cx="9" cy="9" rx="5.2" ry="3.4" fill="#E8F7FF" stroke="#58CCF9" stroke-width="1.3" transform="rotate(-22 9 9)"/>
            <ellipse cx="19" cy="9" rx="5.2" ry="3.4" fill="#E8F7FF" stroke="#58CCF9" stroke-width="1.3" transform="rotate(22 19 9)"/>
            <ellipse cx="14" cy="16.5" rx="7.6" ry="8.2" fill="#C97300"/>

            <rect x="7.4" y="16.2" width="13.2" height="2.4" rx="1.2" fill="#3C3C3C"/>

            <circle cx="16.6" cy="12.6" r="1.3" fill="#3C3C3C"/>
            <path d="M12.2 14.3 Q14 15.8 15.8 14.3" fill="none" stroke="#3C3C3C" stroke-width="1.3" stroke-linecap="round"/>

          <span class="hud-brand-text">Bee Spelling</span>

        <button type="button" id="hud-unit-switcher" class="btn3d btn-sm hud-unit-btn" aria-label="Switch Active Unit">

          <svg class="icon3d icon-cloud-3d" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">

              <linearGradient id="cloudGrad3d" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#58CCF9"/>
                <stop offset="100%" stop-color="#1CB0F6"/>
              </linearGradient>
            </defs>
            <path fill="url(#cloudGrad3d)" stroke="#0F7DBA" stroke-width="1.2" stroke-linejoin="round" d="M6.5 19h11a4.5 4.5 0 0 0 .9-8.9A5.5 5.5 0 0 0 7.7 8.4 4 4 0 0 0 6.5 19z"/>
            <path fill="#FFFFFF" opacity="0.45" d="M8.5 10.2a3.8 3.8 0 0 1 6.2-1.8 3.8 3.8 0 0 0-5.4 2.4z"/>
          </svg>
          <span id="hud-sync-label" class="sync-label-text">Google Drive</span>

        <div id="hud-streak-pill" class="pill-stat" title="Daily Learning Streak">

              <linearGradient id="streakFlameGrad" x1="0" y1="0" x2="0" y2="1">

                <stop offset="55%" stop-color="#FF922B"/>

            <path fill="url(#streakFlameGrad)" stroke="#C92A2A" stroke-width="1.2" stroke-linejoin="round" d="M12.6 2.2c.4 3.2-2.1 4.9-1.7 7.6.3 1.4 1.6 2 2.4.8.6-.9.8-2.2.8-3.1 2.7 1.8 4.4 4.8 4.4 7.8A6.5 6.5 0 0 1 12 21.8a6.5 6.5 0 0 1-6.5-6.5c0-3.3 2-6.1 4.4-8.4.9-.9 1.9-2.5 2.7-4.7z"/>
            <path fill="#FFF9DB" opacity="0.88" d="M12.1 12.2c.5 1.3-.6 2.2-.3 3.4.2.8.9 1.2 1.5.5.4-.5.5-1.1.5-1.7 1.1.9 1.7 2.1 1.7 3.4a3.5 3.5 0 0 1-7 0c0-1.7 1.3-3.5 3.6-5.6z"/>

            <ellipse cx="9.6" cy="13.4" rx="1.7" ry="3.1" fill="#FFFFFF" opacity="0.6" transform="rotate(16 9.6 13.4)"/>

        <button type="button" id="hud-coach-btn" class="btn3d btn-sm btn-purple hud-desktop-only" aria-label="Open Progress and AI Coach Insights">

              <linearGradient id="coachStarGrad" x1="0" y1="0" x2="1" y2="1">

        <button type="button" id="hud-settings-btn" class="btn3d btn-sm hud-settings-btn" aria-label="Settings Menu" title="Settings, Sound, Theme &amp; Vault">

  <!-- Sync Status Popover -->
  <div id="sync-popover" popover="auto" hidden>
    <div class="stack-sm">
      <div class="row-between">
        <strong id="sync-pop-title">Cloud Sync Status</strong>
        <button type="button" id="sync-pop-close" class="btn3d btn-sm btn-icon" aria-label="Close Sync Details">&times;</button>
      </div>
      <p id="sync-pop-detail" class="subtitle-muted">Checking status...</p>

      <div class="row-wrap" style="margin-top:0.25rem;">
        <button type="button" id="sync-force-btn" class="btn3d btn-sm btn-blue" style="flex:1;">Force Sync Now</button>
        <button type="button" id="sync-open-vault-btn" class="btn3d btn-sm" style="flex:1;">Setup Vault</button>
      </div>
    </div>
  </div>

  <!-- ======================================================================
       MAIN APPLICATION STAGE
       ====================================================================== -->
  <main id="app-main" class="app-main" aria-live="polite"></main>

  <!-- ======================================================================
       MODALS, DRAWER, MOBILE SHEET, TOASTS & CONFETTI
       ====================================================================== -->

  <!-- Create / Edit / Import Unit Modal -->
  <dialog id="unit-modal" class="modal-box" closedby="none" aria-labelledby="unit-modal-title">

    /* ========================================================================
       2. SAFE STORAGE WRAPPER (Handles Safari Private Mode & Quota Errors)
       ======================================================================== */
    const SafeStorage = (function () {
      const mem = new Map();
      let useMemoryFallback = false;

      function get(key) {
        try {
          if (!useMemoryFallback) {
            const v = window.localStorage.getItem(key);
            if (v !== null) return v;
          }
        } catch (_) {
          useMemoryFallback = true;
        }
        return mem.has(key) ? mem.get(key) : null;
      }

      function set(key, value) {
        const str = String(value);
        mem.set(key, str);
        try {
          if (!useMemoryFallback) {
            window.localStorage.setItem(key, str);
          }
        } catch (_) {
          useMemoryFallback = true;
        }
      }

      function remove(key) {
        mem.delete(key);
        try {
          if (!useMemoryFallback) {
            window.localStorage.removeItem(key);
          }
        } catch (_) {
          useMemoryFallback = true;
        }
      }

      function getJSON(key, fallback) {
        const raw = get(key);
        if (!raw) return fallback;
        try {
          const parsed = JSON.parse(raw);
          return parsed === null || parsed === undefined ? fallback : parsed;
        } catch (_) {
          return fallback;
        }
      }

      function setJSON(key, obj) {
        try {
          set(key, JSON.stringify(obj));
        } catch (_) {}
      }

      return { get, set, remove, getJSON, setJSON };
    })();

    /* ========================================================================
       3. NULL-SAFE DOM, IME-SAFE KEYBOARD, DIALOG & TOAST HELPERS
       ======================================================================== */
    function byId(id) {
      return document.getElementById(id);
    }

    function clearNode(node) {
      if (!node) return;
      while (node.firstChild) {
        node.removeChild(node.firstChild);
      }
    }

    /**
     * Safe DOM builder: sets text via textContent only; never raw innerHTML.
     */
    function el(tag, attrs, ...children) {
      const node = document.createElement(tag);
      if (attrs && typeof attrs === 'object') {
        for (const [k, v] of Object.entries(attrs)) {
          if (v === undefined || v === null || v === false) continue;
          if (k === 'className') {
            node.className = String(v);
          } else if (k === 'dataset' && typeof v === 'object') {
            for (const [dk, dv] of Object.entries(v)) {
              if (dv !== undefined && dv !== null) node.dataset[dk] = String(dv);
            }
          } else if (k === 'style' && typeof v === 'object') {
            Object.assign(node.style, v);
          } else if (k.startsWith('on') && typeof v === 'function') {
            node.addEventListener(k.slice(2).toLowerCase(), v);
          } else if (v === true) {
            node.setAttribute(k, '');
          } else {
            node.setAttribute(k, String(v));
          }
        }
      }
      const appendChildSafe = (child) => {
        if (child === null || child === undefined || child === false) return;
        if (Array.isArray(child)) {
          child.forEach(appendChildSafe);
        } else if (child instanceof Node) {
          node.appendChild(child);
        } else {
          node.appendChild(document.createTextNode(String(child)));
        }
      };
      children.forEach(appendChildSafe);
      return node;
    }

    /**
     * IME-safe Enter check (including Safari WebKit keyCode 229 & compositionend window).
     */
    let lastCompositionEndStamp = null;
    document.addEventListener('compositionend', (ev) => {
      lastCompositionEndStamp = ev.timeStamp;
    }, true);

    function isImeComposing(ev) {
      if (!ev) return false;
      if (ev.isComposing || ev.keyCode === 229) return true;
      if (lastCompositionEndStamp !== null && Math.abs(ev.timeStamp - lastCompositionEndStamp) < 50) {
        return true;
      }
      return false;
    }

    /* Top-Layer Persistent Toasts (popover="manual" so they show above open <dialog> modals) */
    const activeToasts = [];
    function relayoutToasts() {
      let offset = 0;
      for (let i = activeToasts.length - 1; i >= 0; i--) {
        const item = activeToasts[i];
        item.node.style.setProperty('--toast-offset', offset + 'px');
        offset += (item.node.offsetHeight || 48) + 10;
      }
    }

    function showToast(message, durationMs = 3200) {
      try {
        const supportsPopover = 'popover' in HTMLElement.prototype;
        const toastNode = el('div', {
          className: 'toast-item',
          role: 'status',
          'aria-live': 'polite'
        });
        if (supportsPopover) {
          toastNode.setAttribute('popover', 'manual');
        }
        const msgSpan = el('span', {}, String(message || ''));
        const closeBtn = el('button', {
          type: 'button',
          className: 'toast-close',
          'aria-label': 'Dismiss notification',
          onClick: () => dismiss()
        }, '×');
        toastNode.append(msgSpan, closeBtn);
        document.body.appendChild(toastNode);

        let closed = false;
        const record = { node: toastNode, timer: null };
        activeToasts.push(record);

        const dismiss = () => {
          if (closed) return;
          closed = true;
          if (record.timer) clearTimeout(record.timer);
          const idx = activeToasts.indexOf(record);
          if (idx !== -1) activeToasts.splice(idx, 1);
          try {
            if (supportsPopover && typeof toastNode.hidePopover === 'function') {
              toastNode.hidePopover();
            }
          } catch (_) {}
          toastNode.remove();
          relayoutToasts();
        };

        if (supportsPopover && typeof toastNode.showPopover === 'function') {
          toastNode.showPopover();
        } else {
          toastNode.classList.add('is-open-fallback');
        }

        requestAnimationFrame(relayoutToasts);
        record.timer = setTimeout(dismiss, Math.max(1200, durationMs));
      } catch (err) {
        console.warn('Toast display warning:', err);
      }
    }

    /* Native <dialog> Helpers + Safari Light-Dismiss Fallback */
    function initDialogLightDismissFallback() {
      const hasNativeClosedBy = typeof HTMLDialogElement !== 'undefined' && 'closedBy' in HTMLDialogElement.prototype;
      const allDialogs = document.querySelectorAll('dialog');
      allDialogs.forEach((dlg) => {
        dlg.addEventListener('close', () => {
          // Reset after synchronous close listeners read returnValue so stale values never leak
          queueMicrotask(() => {
            dlg.returnValue = '';
          });
        });

        if (!hasNativeClosedBy && dlg.getAttribute('closedby') === 'any') {
          const isOutside = (ev) => {
            const r = dlg.getBoundingClientRect();
            return ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
          };
          let pressedOutside = false;
          dlg.addEventListener('pointerdown', (ev) => {
            pressedOutside = isOutside(ev);
          });
          dlg.addEventListener('pointerup', (ev) => {
            if (pressedOutside && isOutside(ev) && dlg.open) {
              dlg.close();
            }
            pressedOutside = false;
          });
        }
      });
    }

    function openModalDialog(dlg) {
      if (!dlg) return;
      dlg.returnValue = '';
      try {
        if (!dlg.open) {
          dlg.showModal();
        }
      } catch (_) {
        dlg.setAttribute('open', '');
      }
