          el('button', {
            type: 'button',
            className: 'btn3d btn-green',
            onClick: () => {
              ConfigVault.saveVaultStored({
                geminiKey: geminiKeyDraft.trim(),
                bridgeUrl: bridgeUrlDraft.trim(),
                driveFolderUrl: folderUrlDraft.trim(),
                textModel: textModelDraft.trim(),
                ttsModel: ttsModelDraft.trim()
              });
              closeModalDialog(dlg);
              updateHudUI();
              renderCurrentScreen();
              if (ConfigVault.getEffective().bridgeUrl) {
                DriveSyncManager.runSyncCycle({ pullManifest: true, forceAll: true });
              }
              showToast('Vault settings saved & uploading data to Google Drive!');
            }
          }, 'Save Vault')
        );
      };

      redraw();
      openModalDialog(dlg);
    }

    /* ------------------------------------------------------------------------
       DRAWER: PROGRESS & GEMINI AI COACH INSIGHTS (Section 5.4 & 7.3)
       ------------------------------------------------------------------------ */
    function openAnalyticsDrawer(initialTab = 'progress') {
      const dlg = byId('analytics-drawer');
      const body = byId('analytics-drawer-body');
      if (!dlg || !body) return;

      const unitsList = Object.values(AppState.unitsById);
      let targetUnit =
        (AppState.activeUnitId && AppState.unitsById[AppState.activeUnitId]) ||
        unitsList[0] ||
        null;

      let tab = initialTab === 'coach' ? 'coach' : 'progress';
      let loadingCoach = false;

      const redraw = () => {
        clearNode(body);

        if (!targetUnit) {
          body.appendChild(el('p', { className: 'subtitle-muted' }, 'Create or select a vocabulary unit first to view analytics.'));
          return;
        }

        // Unit selector if multiple units exist
        if (unitsList.length > 1) {
          const uSelect = el('select', {
            className: 'select3d',
            onChange: () => {
              targetUnit = AppState.unitsById[uSelect.value] || targetUnit;
              redraw();
            }
          }, unitsList.map((u) => el('option', { value: u.id, selected: u.id === targetUnit.id }, u.name)));
          body.appendChild(uSelect);
        }

        const tabBar = el('div', { className: 'tab-bar', role: 'tablist' },
          el('button', {
            type: 'button',
            role: 'tab',
            className: 'btn3d tab-btn',
            'aria-selected': String(tab === 'progress'),
            onClick: () => { tab = 'progress'; redraw(); }
          }, 'Progress'),
          el('button', {
            type: 'button',
            role: 'tab',
            className: 'btn3d tab-btn',
            'aria-selected': String(tab === 'coach'),
            onClick: () => { tab = 'coach'; redraw(); }
          }, 'AI Coach Insights')
        );
        body.appendChild(tabBar);

        if (tab === 'progress') {
          const stats = LearningEngine.computeUnitStats(targetUnit);

          body.appendChild(el('div', { className: 'row-wrap' },
            el('span', { className: 'pill-stat' }, `Streak: ${(AppState.progress.streak && AppState.progress.streak.count) || 0}d`),
            el('span', { className: 'pill-stat' }, `XP: ${Number(AppState.progress.xp) || 0}`),
            el('span', { className: 'pill-stat' }, `Mastered: ${stats.mastered}/${stats.total}`)
          ));

          // Words in 3-Strike Recovery with ●●○ dots
          const recoveringWords = targetUnit.words
            .map((w) => ({ w, rec: LearningEngine.getWordRecord(targetUnit.id, w.id) }))
            .filter((x) => x.rec.status === 'recovering')
            .sort((a, b) => (a.rec.mistakeStreakRecovery || 0) - (b.rec.mistakeStreakRecovery || 0));

          const recList = el('div', { className: 'stack-sm' });
          if (recoveringWords.length === 0) {
            recList.appendChild(el('p', { className: 'subtitle-muted' }, 'Zero words in recovery right now!'));
          } else {
            recoveringWords.forEach(({ w, rec }) => {
              const stage = Number(rec.mistakeStreakRecovery) || 0;
              const dots = el('span', { className: 'strike-dots', title: `${stage}/3 recovery strikes` },
                [0, 1, 2].map((i) => el('span', { className: 'strike-dot' + (i < stage ? ' filled' : '') }))
              );
              recList.appendChild(el('div', {
                className: 'card3d row-between',
                style: { padding: '0.6rem 0.85rem' }
              },
                el('div', { className: 'row-wrap' },
                  el('strong', {}, w.word),
                  el('span', { className: 'pos-chip-mini' }, w.partOfSpeech)
                ),
                el('div', { className: 'row-wrap' },
                  dots,
                  el('button', {
                    type: 'button',
                    className: 'btn3d btn-sm btn-blue btn-icon',
                    title: `Pronounce ${w.word}`,
                    'aria-label': `Pronounce ${w.word}`,
                    onClick: () => TTSManager.speak(w.word, { slow: false })
                  }, createIcon3D('speaker', 19))
                )
              ));
            });
          }

          body.appendChild(el('div', { className: 'stack-sm' },
            el('h3', { style: { fontSize: '1.05rem' } }, `Words in 3-Strike Recovery (${recoveringWords.length})`),
            recList
          ));

          // Accuracy by Difficulty & Part of Speech
          const diffRows = el('div', { className: 'stack-sm' });
          DIFFICULTIES.forEach((d) => {
            const sub = targetUnit.words.filter((w) => w.difficulty === d);
            if (!sub.length) return;
            let c = 0;
            let wr = 0;
            sub.forEach((w) => {
              const r = LearningEngine.getWordRecord(targetUnit.id, w.id);
              c += Number(r.timesCorrect) || 0;
              wr += Number(r.timesWrong) || 0;
            });
            const pct = (c + wr) > 0 ? `${Math.round((c / (c + wr)) * 100)}% (${c}/${c + wr})` : 'Not practiced yet';
            diffRows.appendChild(el('div', { className: 'row-between', style: { fontSize: '0.9rem' } },
              el('span', { style: { textTransform: 'capitalize' } }, d),
              el('strong', {}, pct)
            ));
          });

          body.appendChild(el('div', { className: 'card3d stack-sm' },
            el('h3', { style: { fontSize: '1.02rem' } }, 'Accuracy by Difficulty'),
            diffRows
          ));

          // Accuracy by Mode (from attempts & mistake log)
          const unitMistakes = ((AppState.mistakes && AppState.mistakes.entries) || []).filter((m) => m.unitId === targetUnit.id);
          const spellErrs = unitMistakes.filter((m) => m.type === 'spelling').length;
          const posErrs = unitMistakes.filter((m) => m.type === 'partOfSpeech').length;
          body.appendChild(el('div', { className: 'card3d stack-sm' },
            el('h3', { style: { fontSize: '1.02rem' } }, 'Mistake Breakdown'),
            el('div', { className: 'row-between', style: { fontSize: '0.9rem' } },
              el('span', {}, 'Spelling slips logged'),
              el('strong', {}, String(spellErrs))
            ),
            el('div', { className: 'row-between', style: { fontSize: '0.9rem' } },
              el('span', {}, 'Part of Speech slips logged'),
              el('strong', {}, String(posErrs))
            )
          ));

          // Mastered Words List
          const masteredWords = targetUnit.words.filter((w) => LearningEngine.getWordRecord(targetUnit.id, w.id).status === 'mastered');
          if (masteredWords.length > 0) {
            body.appendChild(el('div', { className: 'card3d stack-sm' },
              el('h3', { style: { fontSize: '1.02rem' } }, `Mastered Words (${masteredWords.length})`),
              el('div', { className: 'row-wrap' },
                masteredWords.map((w) => el('span', { className: 'pos-chip-mini', style: { background: 'var(--green-soft)', borderColor: 'var(--feather-green)' } }, w.word))
              )
            ));
          }
        } else {
          // Tab 2: AI Coach Insights
          const savedForUnit = ((AppState.reports && AppState.reports.reports) || [])
            .filter((r) => r && r.unitId === targetUnit.id)
            .slice(-1)[0];

          const report = (savedForUnit && savedForUnit.report) || AICoachEngine.buildLocalRuleInsights(targetUnit);

          body.appendChild(el('div', { className: 'card3d row-wrap', style: { background: 'var(--honey-soft)', borderColor: 'var(--honey-gold-lip)' } },
            createBeeMascot(loadingCoach ? 'thinking' : 'happy', 64),
            el('div', { className: 'stack-sm', style: { flex: '1 1 200px' } },
              el('strong', {}, report.source === 'gemini' ? 'Buzzy’s Gemini AI Coaching' : 'Buzzy’s Smart Study Coach'),
              el('p', { style: { fontSize: '0.92rem' } }, report.encouragement)
            )
          ));

          body.appendChild(el('button', {
            type: 'button',
            className: 'btn3d btn-purple btn-block',
            disabled: loadingCoach,
            onClick: async () => {
              const cd = AICoachEngine.getCooldownRemainingSec();
              if (cd > 0) {
                showToast(`Wait ${cd}s before refreshing AI Coach insights.`);
                return;
              }
              loadingCoach = true;
              redraw();
              try {
                const fresh = await AICoachEngine.generateCoachReport(targetUnit);
                if (fresh.source !== 'gemini') {
                  DataStore.saveGeminiReport(targetUnit.id, fresh);
                }
                showToast(fresh.source === 'gemini' ? 'Gemini AI insights updated!' : 'Updated with local rule-based coach!');
              } catch (err) {
                showToast((err && err.message) || 'Could not refresh insights.');
              } finally {
                loadingCoach = false;
                redraw();
              }
            }
          }, loadingCoach ? 'Buzzy is analyzing your mistakes...' : 'Refresh AI Coach Insights'));

          const makeBulletCard = (heading, list) =>
            el('div', { className: 'card3d stack-sm' },
              el('h3', { style: { fontSize: '1rem' } }, heading),
              ...(list || []).map((txt) => el('p', { style: { fontSize: '0.9rem' } }, `• ${txt}`))
            );

          body.appendChild(makeBulletCard('Strengths', report.strengths));

          if (report.wordsToRescue && report.wordsToRescue.length) {
            body.appendChild(el('div', { className: 'card3d stack-sm' },
              el('h3', { style: { fontSize: '1rem' } }, 'Words to Rescue & Memory Tricks'),
              ...report.wordsToRescue.map((item) =>
                el('div', { className: 'stack-sm', style: { padding: '0.45rem 0.6rem', background: 'var(--bg-subtle)', borderRadius: '10px' } },
                  el('strong', {}, item.word),
                  el('span', { style: { fontSize: '0.88rem' } }, item.tip)
                )
              )
            ));
          }

          body.appendChild(makeBulletCard('Spelling Patterns Spotted', report.spellingPatterns));
          body.appendChild(makeBulletCard('Part of Speech Tips', report.partOfSpeechTips));
          body.appendChild(makeBulletCard('Next Study Plan', report.studyPlan));
        }
      };

      redraw();
      openModalDialog(dlg);
    }

    /* ========================================================================
       14. GLOBAL LISTENERS, KEYBOARD-AWARE VIEWPORT, ERROR GUARDS & BOOT
       ======================================================================== */
    function bindStaticHudAndModalEvents() {
      const brandBtn = byId('hud-brand-btn');
      if (brandBtn) {
        brandBtn.addEventListener('click', () => navigate('unitsHub'));
      }

      const unitBtn = byId('hud-unit-switcher');
      if (unitBtn) {
        unitBtn.addEventListener('click', () => navigate('unitsHub'));
      }

      const syncBtn = byId('hud-sync-btn');
      if (syncBtn) {
        syncBtn.addEventListener('click', () => toggleSyncPopover());
      }

      const syncClose = byId('sync-pop-close');
      if (syncClose) syncClose.addEventListener('click', () => hideSyncPopover());

      const syncForce = byId('sync-force-btn');
      if (syncForce) {
        syncForce.addEventListener('click', () => {
          hideSyncPopover();
          DriveSyncManager.flushNow({ pullManifest: true, forceAll: true });
          showToast('Uploading all user data to Google Drive...');
        });
      }

      const syncVault = byId('sync-open-vault-btn');
      if (syncVault) {
        syncVault.addEventListener('click', () => {
          hideSyncPopover();
          openVaultModal();
        });
      }

      const coachBtn = byId('hud-coach-btn');
      if (coachBtn) coachBtn.addEventListener('click', () => openAnalyticsDrawer('progress'));

      const settingsBtn = byId('hud-settings-btn');
      if (settingsBtn) settingsBtn.addEventListener('click', () => openMoreSheet());

      // Modal close buttons & dirty guard on Create/Edit Unit modal
      const unitDlg = byId('unit-modal');
      const unitClose = byId('unit-modal-close');
      if (unitClose) unitClose.addEventListener('click', () => tryCloseUnitModal());
      if (unitDlg) {
        unitDlg.addEventListener('cancel', (ev) => {
          if (unitModalDirty) {
            ev.preventDefault();
            tryCloseUnitModal();
          }
        });
      }



      const vaultClose = byId('vault-modal-close');
      if (vaultClose) vaultClose.addEventListener('click', () => closeModalDialog(byId('vault-modal')));

      const drawerClose = byId('analytics-drawer-close');
      if (drawerClose) drawerClose.addEventListener('click', () => closeModalDialog(byId('analytics-drawer')));

      const moreClose = byId('more-sheet-close');
      if (moreClose) moreClose.addEventListener('click', () => closeModalDialog(byId('more-sheet-dialog')));

      const qrClose = byId('qr-modal-close');
      if (qrClose) qrClose.addEventListener('click', () => closeModalDialog(byId('qr-modal')));

      const qrDone = byId('qr-modal-done-btn');
      if (qrDone) qrDone.addEventListener('click', () => closeModalDialog(byId('qr-modal')));

      // Escape key fallback for screen navigation when no dialog is open
      window.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape') return;
        if (document.querySelector('dialog[open]')) return;
        hideSyncPopover();
        if (['memories', 'miniQuiz', 'quizSetup', 'quizPlay', 'quizResults'].includes(AppState.screen)) {
          navigate('unitHome');
        } else if (AppState.screen === 'unitHome') {
          navigate('unitsHub');
        }
      });

      // Mobile virtual keyboard visibility helper (Section 10.6)
      const keepFocusedInputVisible = () => {
        const active = document.activeElement;
        if (!active) return;
        const tag = active.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') {
          setTimeout(() => {
            try {
              active.scrollIntoView({ block: 'center', behavior: 'smooth' });
            } catch (_) {}
          }, 120);
        }
      };

      document.addEventListener('focusin', (ev) => {
        const t = ev.target && ev.target.tagName;
        if (t === 'INPUT' || t === 'TEXTAREA') keepFocusedInputVisible();
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', keepFocusedInputVisible);
      }

      // Sync lifecycle hooks: online, tab focus, visibility hidden, pagehide
      window.addEventListener('online', () => {
        showToast('Back online — syncing changes...', 2200);
        DriveSyncManager.runSyncCycle({ pullManifest: true });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          DriveSyncManager.runSyncCycle({ pullManifest: true });
        } else {
          DriveSyncManager.flushNow({ keepalive: true, pullManifest: false });
        }
      });

      window.addEventListener('pagehide', () => {
        DriveSyncManager.flushNow({ keepalive: true, pullManifest: false });
      });
    }

    // Global uncaught error & unhandled rejection resilience (Section 11)
    window.addEventListener('error', (ev) => {
      console.error('Bee Spelling runtime error:', ev.error || ev.message);
      showToast('Something hiccupped, but your progress is safe!', 3000);
    });

    window.addEventListener('unhandledrejection', (ev) => {
      console.error('Bee Spelling unhandled rejection:', ev.reason);
      if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
    });

    function bootApp() {
      initDialogLightDismissFallback();
      ThemeController.updateThemeIcon();
      bindStaticHudAndModalEvents();

      const importedSetupLink = ConfigVault.consumeSetupHashOnBoot();
      WorkspaceBoot.initOnBoot();

      if (importedSetupLink) {
        setTimeout(() => {
          showToast('Google Drive Sync Bridge configured from Setup Link!', 4000);
        }, 220);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp, { once: true });
    } else {
      bootApp();
    }
  })();
  </script>
